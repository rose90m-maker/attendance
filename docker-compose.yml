version: "3.9"

# ============================================================
# 근태관리 시스템 Docker 구성 (.5 Linux 서버 운영본)
#
# [최초 실행]
#   1. .env 파일 준비 (DB_PASSWORD 포함)
#   2. docker compose up -d db
#   3. DB 데이터 import:
#      docker compose exec -T db mariadb -u root -p${DB_PASSWORD} attendance < attendance_migrate.sql
#   4. docker compose up -d
#
# [이후 배포]
#   python deploy_and_restart.py  (코드만 갱신 + 재시작)
#   python deploy_and_restart.py --rebuild  (이미지 재빌드 포함)
# ============================================================

services:
  app:
    build: .
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: attendance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  tbm:
    build:
      context: .
      dockerfile: Dockerfile.tbm
    container_name: attendance-tbm
    restart: unless-stopped
    ports:
      - "5051:5051"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: attendance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  # 리버스 프록시 (도메인별 라우팅, HTTP-only — SSL은 추후 추가)
  proxy:
    image: nginx:1.27-alpine
    container_name: attendance-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # SSL 도입 시 활성화
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       # SSL 인증서 디렉토리 (Let's Encrypt용)
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
      - tbm
    networks:
      - attendance-net

  # KEPCO 파워플래너 자동 스크래퍼 (Playwright + cron)
  kepco-scraper:
    build:
      context: .
      dockerfile: Dockerfile.kepco
    container_name: attendance-kepco
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 같은 docker network 내에서 app 컨테이너로 직접 호출
      POWER_API_URL: "http://app:5050/api/power_upload"
      POWER_BILL_API_URL: "http://app:5050/api/power_bill_upload"
      POWER_SMARTVIEW_API_URL: "http://app:5050/api/power_smartview_upload"
      # DB 직접 쓰기 fallback도 지원
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - app
    volumes:
      - ./pp_screenshots:/app/pp_screenshots
      - ./pp_downloads:/app/pp_downloads
      - ./.env:/app/.env:ro     # cron이 source 하려면 파일 필요
    networks:
      - attendance-net

  db:
    image: mariadb:10.11
    container_name: attendance-db
    restart: unless-stopped
    ports:
      - "3307:3306"      # caps_sync.py 등 외부 접속용
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: attendance
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_general_ci
    # 성능 최적화: 버퍼풀 1GB + 슬로우 쿼리 로그 ON
    command: >
      --innodb-buffer-pool-size=1G
      --slow-query-log=1
      --long-query-time=1.0
      --max-connections=200
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    volumes:
      - attendance-db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-net

volumes:
  attendance-db:
    driver: local

networks:
  attendance-net:
    driver: bridge
