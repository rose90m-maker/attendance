version: "3.9"

# ============================================================
# 근태관리 시스템 Docker 구성 (.5 Linux 서버 운영본)
#
# [최초 실행]
#   1. .env 파일 준비 (DB_PASSWORD 포함)
#   2. docker compose up -d db
#   3. DB 데이터 import:
#      docker compose exec -T db mariadb -u root -p${DB_PASSWORD} attendance < attendance_migrate.sql
#   4. docker compose up -d
#
# [이후 배포]
#   python deploy_and_restart.py  (코드만 갱신 + 재시작)
#   python deploy_and_restart.py --rebuild  (이미지 재빌드 포함)
# ============================================================

services:
  app:
    build: .
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: attendance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  tbm:
    build:
      context: .
      dockerfile: Dockerfile.tbm
    container_name: attendance-tbm
    restart: unless-stopped
    ports:
      - "5051:5051"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: attendance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  db:
    image: mariadb:10.11
    container_name: attendance-db
    restart: unless-stopped
    ports:
      - "3307:3306"      # caps_sync.py 등 외부 접속용
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: attendance
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_general_ci
    volumes:
      - attendance-db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-net

volumes:
  attendance-db:
    driver: local

networks:
  attendance-net:
    driver: bridge
