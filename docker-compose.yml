version: "3.9"

# ============================================================
# 근태관리 시스템 Docker 구성
#
# [현재 운영 중인 시스템과 포트 충돌 없음]
#   - 현재: Flask 5050, MariaDB 3307 (NAS 패키지)
#   - Docker: Flask 5060, MariaDB 3308 (컨테이너)
#
# [전환 방법]
#   1. 아래 ports: "5060:5050" → "5050:5050" 으로 변경
#   2. NAS MariaDB 패키지 중지: synoservice --stop pkgctl-MariaDB10
#   3. docker compose up -d
#
# [최초 실행 시 DB 초기화]
#   docker compose up -d db
#   docker compose exec db bash -c \
#     "mariadb -u root -p7602mr attendance < /docker-entrypoint-initdb.d/attendance.sql"
# ============================================================

services:
  app:
    build: .
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "5080:5050"      # Mac 대기 서버: 5080
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "7602mr"
      DB_NAME: attendance
    env_file:
      - .env             # OPENAI_API_KEY, GROQ_API_KEY 등
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  tbm:
    build:
      context: .
      dockerfile: Dockerfile.tbm
    container_name: attendance-tbm
    restart: unless-stopped
    ports:
      - "5081:5051"      # Mac 대기 TBM: 5081
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "7602mr"
      DB_NAME: attendance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-net

  db:
    image: mariadb:10.11
    container_name: attendance-db
    restart: unless-stopped
    ports:
      - "3308:3306"      # 전환 시 → "3307:3306" (기존 NAS MariaDB 중지 후)
    environment:
      MARIADB_ROOT_PASSWORD: "7602mr"
      MARIADB_DATABASE: attendance
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_general_ci
    volumes:
      - attendance-db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d  # .sql 파일 자동 실행 (최초 1회)
      - ./db-slave/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro  # 슬레이브 설정
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-net

volumes:
  attendance-db:
    driver: local

networks:
  attendance-net:
    driver: bridge
