<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전진단 수정 #{{ rec.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}?v=26" rel="stylesheet">
    <style>
        .haz-block { border-left:4px solid #dee2e6; padding-left:12px; margin-bottom:16px; }
        .haz-block.grade-hi  { border-color:#991b1b; }
        .haz-block.grade-mid { border-color:#c2410c; }
        .haz-block.grade-lo  { border-color:#15803d; }
    </style>
</head>
<body>
{% set active_page = 'safety_ai' %}
{% include '_sidebar.html' %}

<div class="container-fluid mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div class="page-title mb-0">
            <span class="title-icon">✏️</span>
            <span>안전진단 수정 #{{ rec.id }}</span>
        </div>
        <a href="/safety_ai/{{ rec.id }}" class="btn btn-outline-secondary btn-sm">← 보고서로</a>
    </div>

    <form method="post">
        <!-- 종합 판정 + 의견 -->
        <div class="card shadow-sm mb-3">
            <div class="card-header fw-bold">종합 의견 수정</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label small fw-bold text-muted">종합판정</label>
                        <select name="overall" class="form-select form-select-sm">
                            {% for v in ['안전','주의','위험','검토필요'] %}
                            <option value="{{ v }}" {% if rec.overall == v %}selected{% endif %}>{{ v }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-10">
                        <label class="form-label small fw-bold text-muted">종합 의견</label>
                        <textarea name="summary" class="form-control form-control-sm" rows="3">{{ rec.summary or '' }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- 위험요인별 수정 -->
        {% for h in hazards %}
        {% set grade = h.get('grade','하') %}
        <div class="card shadow-sm mb-2 haz-block {% if grade == '상' %}grade-hi{% elif grade == '중' %}grade-mid{% else %}grade-lo{% endif %}" style="border-radius:6px;">
            <div class="card-body py-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0">No.{{ loop.index }}</h6>
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" name="delete" value="{{ loop.index0 }}" id="del_{{ loop.index0 }}">
                        <label class="form-check-label text-danger small" for="del_{{ loop.index0 }}">삭제</label>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1">위험요인명</label>
                        <input class="form-control form-control-sm" name="name_{{ loop.index0 }}" value="{{ h.get('name','') }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1">위험등급</label>
                        <select name="grade_{{ loop.index0 }}" class="form-select form-select-sm">
                            {% for g in ['상','중','하'] %}
                            <option value="{{ g }}" {% if h.get('grade') == g %}selected{% endif %}>{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1">사고유형</label>
                        <input class="form-control form-control-sm" name="acc_{{ loop.index0 }}" value="{{ h.get('accident_type','') }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-muted mb-1">현장 상태</label>
                        <textarea class="form-control form-control-sm" name="site_{{ loop.index0 }}" rows="2">{{ h.get('site_state','') }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1">즉시조치</label>
                        <textarea class="form-control form-control-sm" name="imm_{{ loop.index0 }}" rows="2">{{ h.get('immediate_action','') }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1">단기조치</label>
                        <textarea class="form-control form-control-sm" name="short_{{ loop.index0 }}" rows="2">{{ h.get('short_term_action','') }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1">재발방지</label>
                        <textarea class="form-control form-control-sm" name="prev_{{ loop.index0 }}" rows="2">{{ h.get('prevention_action','') }}</textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-muted mb-1">보고서용 문장</label>
                        <textarea class="form-control form-control-sm" name="rep_{{ loop.index0 }}" rows="2">{{ h.get('report_sentence','') }}</textarea>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary btn-sm">💾 저장</button>
            {% if not rec.confirmed %}
            <button type="submit" name="action" value="confirm" class="btn btn-success btn-sm">✅ 저장 + 확정</button>
            {% endif %}
            <a href="/safety_ai/{{ rec.id }}" class="btn btn-outline-secondary btn-sm">취소</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
