<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TBM 관리{% endblock %} — 태인관리시스템</title>
<link rel="icon" type="image/gif" href="/static/LOGO.GIF">
<link rel="apple-touch-icon" href="/static/LOGO.GIF">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1e40af">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}?v=21" rel="stylesheet">
<style>
:root{--tbm-primary:#6d28d9;--tbm-secondary:#7c3aed;--tbm-elec:#1d4ed8;--tbm-elec-light:#dbeafe;
       --tbm-electronics:#065f46;--tbm-electronics-light:#d1fae5;}
.page-header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;border-radius:4px;
  margin-bottom:14px;border:1px solid #dde2e8;}
.page-header h4{margin:0;font-weight:700;color:#1f2937;}
.stat-card{border-radius:12px;padding:14px 18px;color:#fff;position:relative;overflow:hidden;}
.stat-card .sc-val{font-size:2rem;font-weight:800;line-height:1;}
.stat-card .sc-lbl{font-size:.78rem;opacity:.9;margin-top:2px;}
.sc-purple{background:linear-gradient(135deg,#6d28d9,#7c3aed);}
.sc-blue{background:linear-gradient(135deg,#1d4ed8,#2563eb);}
.sc-green{background:linear-gradient(135deg,#065f46,#047857);}
.sc-red{background:linear-gradient(135deg,#b91c1c,#dc2626);}
.dept-badge-elec{background:var(--tbm-elec-light);color:var(--tbm-elec);
  border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;}
.dept-badge-electronic{background:var(--tbm-electronics-light);color:var(--tbm-electronics);
  border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;}
.status-open{background:#d1fae5;color:#065f46;border-radius:20px;padding:2px 12px;
  font-size:.75rem;font-weight:700;}
.status-closed{background:#fee2e2;color:#991b1b;border-radius:20px;padding:2px 12px;
  font-size:.75rem;font-weight:700;}
.btn-tbm-primary{background:var(--tbm-primary);color:#fff;border:none;}
.btn-tbm-primary:hover{background:var(--tbm-secondary);color:#fff;}
.tbm-wrap{padding:14px 24px;}
@media (max-width:767.98px){.tbm-wrap{padding:10px 12px;}}
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
{% include '_sidebar.html' %}

<div class="tbm-wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
    {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
