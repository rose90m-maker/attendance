<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3소스 검증 — 태인관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="apple-touch-icon" href="/static/LOGO.GIF">
<link rel="manifest" href="/static/manifest.json">
<style>
.sv-legend { font-size:0.76rem; }
.sv-legend .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
.sv-tbl { font-size:0.8rem; width:100%; border-collapse:collapse; }
.sv-tbl th { background:#f8f9fa; color:#555; font-weight:600; font-size:0.74rem;
             padding:6px 8px; border-bottom:2px solid #dee2e6; text-align:center;
             position:sticky; top:0; z-index:2; }
.sv-tbl td { padding:5px 8px; border-bottom:1px solid #f1f3f5; text-align:center; }
.sv-tbl td.d { text-align:left; white-space:nowrap; }
.sv-tbl tr.we td { background:#fcfcfd; }
.sv-tbl tr.hol td.d { color:#dc3545; font-weight:600; }
.sv-tbl tr.bad { background:#fff5f5; }
.sv-src { font-variant-numeric:tabular-nums; }
.sv-x  { color:#0d6efd; font-weight:700; }
.sv-r  { color:#495057; }
.sv-m  { color:#0f5132; }
.sv-t  { color:#6c757d; font-size:0.76rem; }
.badge-diff { font-size:0.68rem; }
.sv-etc { font-size:0.7rem; color:#7048e8; }
/* 전원 목록 */
.pp-tbl { font-size:0.82rem; width:100%; border-collapse:collapse; }
.pp-tbl th { background:#f8f9fa; color:#555; font-weight:600; font-size:0.75rem;
             padding:7px 10px; border-bottom:2px solid #dee2e6; position:sticky; top:0; z-index:2; }
.pp-tbl td { padding:6px 10px; border-bottom:1px solid #f1f3f5; }
.pp-tbl tbody tr { cursor:pointer; }
.pp-tbl tbody tr:hover { background:#f1f8ff; }
.pp-tbl tr.open { background:#e7f1ff; font-weight:600; }
.pp-tbl tr.zero td { color:#8a8f96; }
.pp-num { text-align:right; font-variant-numeric:tabular-nums; }
.kpi { font-size:0.85rem; }
.kpi b { font-size:1.25rem; }
/* 일자 → 근무보고서 보기 */
.day-link { color:#0d6efd; text-decoration:none; border-bottom:1px dotted #9ec5fe; }
.day-link:hover { color:#0a58ca; border-bottom-style:solid; }
.wr-card { border:1px solid #dee2e6; border-radius:8px; margin-bottom:12px; }
.wr-card.final { border-color:#0d6efd; box-shadow:0 0 0 2px rgba(13,110,253,.08); }
.wr-head { background:#f8f9fa; padding:7px 12px; border-bottom:1px solid #e9ecef;
           display:flex; justify-content:space-between; align-items:center; font-size:0.82rem; }
.wr-body { padding:10px 12px; }
.wr-cat { display:flex; gap:8px; padding:4px 0; border-bottom:1px solid #f4f4f4; font-size:0.8rem; }
.wr-cat:last-child { border-bottom:none; }
.wr-cat .k { width:88px; flex-shrink:0; font-weight:600; color:#555; }
.wr-cat .v { flex:1; color:#333; }
.wr-mine { background:#fff3cd; border-radius:3px; padding:0 4px; font-weight:700; }
.detail-wrap { background:#fbfcfd; border-top:2px solid #dee2e6; }
</style>
</head>
<body>
{% set active_page = 'source_verify' %}
{% include '_sidebar.html' %}

<div class="container-fluid mt-4">
    <div class="page-title mb-3">
        <span class="title-icon">🔎</span>
        <span>3소스 검증</span>
    </div>

    <div class="card mb-3">
        <div class="card-body py-3">
            <div class="row g-2 align-items-end">
                <div class="col-auto">
                    <label class="form-label mb-0" style="font-size:0.75rem;">월</label>
                    <input type="month" id="svMonth" class="form-control form-control-sm"
                           style="width:150px;" value="{{ sel_month }}" onchange="ppLoad()">
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0" style="font-size:0.75rem;">그룹</label>
                    <select id="ppGroup" class="form-select form-select-sm" style="width:140px;"
                            onchange="ppRender()">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-0" style="font-size:0.75rem;">이름</label>
                    <input type="text" id="ppName" class="form-control form-control-sm"
                           style="width:130px;" placeholder="이름 검색" oninput="ppRender()">
                </div>
                <div class="col-auto">
                    <div class="form-check form-check-inline mt-3">
                        <input class="form-check-input" type="checkbox" id="ppOnlyErr"
                               checked onchange="ppRender()">
                        <label class="form-check-label" style="font-size:0.78rem;" for="ppOnlyErr">
                            오류 있는 인원만
                        </label>
                    </div>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="ppCsv()">CSV</button>
                </div>
                <div class="col ms-2 text-end kpi" id="ppKpi"></div>
            </div>
            <div class="sv-legend text-muted mt-2">
                <span class="me-3"><span class="dot" style="background:#0d6efd;"></span>근무표 <b>(정본 · 이민영 사원 작성)</b></span>
                <span class="me-3"><span class="dot" style="background:#495057;"></span>근무보고서 (담당자 작성)</span>
                <span class="me-3"><span class="dot" style="background:#0f5132;"></span>수정보고서</span>
                <span class="me-3"><span class="dot" style="background:#6c757d;"></span>근태기록 (출입 · 보조 검증)</span>
                <span>인원을 클릭하면 일자별 상세가 열립니다</span>
                <div class="mt-1" style="color:#6c757d;">
                    ※ <b>당일분은 대조에서 제외</b>됩니다 (아직 작성 중이라 오류로 보지 않음).
                    그날치만 있는 그룹은 목록에 나오지 않습니다 — 다음 날 대조부터 포함됩니다.
                </div>
                <div id="ppNoRepGrp" class="mt-1" style="display:none; color:#b45309;"></div>
            </div>
            <div id="ppNotRun" class="alert alert-warning py-2 px-3 mb-0 mt-2"
                 style="display:none; font-size:.82rem;"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div style="max-height:720px; overflow-y:auto;">
                <table class="pp-tbl">
                    <thead>
                        <tr>
                            <th style="text-align:left;">이름</th>
                            <th style="text-align:left;">부서</th>
                            <th style="text-align:left;">그룹</th>
                            <th class="pp-num">점검</th>
                            <th class="pp-num">출입</th>
                            <th class="pp-num">오류</th>
                            <th style="text-align:left;">오류 유형</th>
                            <th class="pp-num">일치율</th>
                        </tr>
                    </thead>
                    <tbody id="ppRows">
                        <tr><td colspan="8" class="text-muted py-4 text-center">불러오는 중…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 근무보고서 보기 -->
<div class="modal fade" id="wrModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title fw-bold" id="wrTitle" style="font-size:0.95rem;">근무보고서</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="wrBody">불러오는 중…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var ppData = null, svCache = {}, openName = null;

function hhmm(t) { return t ? t.slice(0,2) + ':' + t.slice(2,4) : ''; }

var TYPE_CLS = {
    '연장과다': 'bg-danger', '연장누락': 'bg-danger',
    '값불일치': 'bg-warning text-dark', '미작성': 'bg-secondary',
    '근무표없음': 'bg-info text-dark'
};

// ═══ 전원 목록 ═══
function ppLoad() {
    openName = null; svCache = {};
    var m = document.getElementById('svMonth').value;
    fetch('/api/source_verify_all?month=' + encodeURIComponent(m))
      .then(function(r){ return r.json(); })
      .then(function(d) {
        if (!d.ok) {
            document.getElementById('ppRows').innerHTML =
                '<tr><td colspan="8" class="text-danger py-3">' + (d.error || '오류') + '</td></tr>';
            return;
        }
        ppData = d;
        var gs = document.getElementById('ppGroup');
        var keep = gs.value;
        gs.innerHTML = '<option value="">전체</option>'
            + (d.groups || []).map(function(g){
                return '<option value="' + g + '">' + g + '</option>'; }).join('');
        gs.value = keep;
        ppRender();
      })
      .catch(function(e) {
        document.getElementById('ppRows').innerHTML =
            '<tr><td colspan="8" class="text-danger py-3">조회 실패: ' + e + '</td></tr>';
      });
}

function ppFiltered() {
    if (!ppData) return [];
    var g = document.getElementById('ppGroup').value;
    var nm = document.getElementById('ppName').value.trim();
    var onlyErr = document.getElementById('ppOnlyErr').checked;
    return ppData.rows.filter(function(r){
        if (g && r.group !== g) return false;
        if (nm && r.name.indexOf(nm) < 0) return false;
        if (onlyErr && !r.errors) return false;
        return true;
    });
}

function ppRender() {
    if (!ppData) return;
    var rows = ppFiltered();
    // 근무표가 아직 안 올라온 달은 대조 자체가 안 돈다.
    // 그때 '오류 0건 · 이상없음'으로 보이면 검증이 끝난 것으로 오해한다.
    document.getElementById('ppKpi').innerHTML = ppData.compared
      ? ('대상 <b>' + ppData.total_people + '</b>명 · 오류 <b class="'
         + (ppData.total_errors ? 'text-danger' : 'text-success') + '">'
         + ppData.total_errors + '</b>건 · 이상없음 <b class="text-success">'
         + ppData.clean + '</b>명'
         + (ppData.compared_at ? ' <span class="text-muted" style="font-size:.78rem;">· 대조 '
                                 + ppData.compared_at + '</span>' : ''))
      : ('대상 <b>' + ppData.total_people + '</b>명 · '
         + '<b class="text-warning">아직 대조하지 않았습니다</b>'
         + ' <span class="text-muted" style="font-size:.78rem;">· 근무표 미등록</span>');

    // 그달 보고서가 0건인 그룹 — 대조는 근무보고서에 이름이 있는 사람만 보므로
    // 이런 그룹은 '미작성'으로도 안 잡히고 통째로 빠진다.
    var ng = document.getElementById('ppNoRepGrp');
    var nrg = ppData.no_report_groups || [];
    if (ng) {
        ng.style.display = nrg.length ? '' : 'none';
        ng.innerHTML = nrg.length
            ? '※ <b>' + nrg.join(' · ') + '</b> 그룹은 이번 달 근무보고서가 없어 '
              + '<b>검증 대상에서 빠져 있습니다.</b> 근무표에 인원이 있어도 대조되지 않습니다.'
            : '';
    }

    var warn = document.getElementById('ppNotRun');
    if (warn) {
        warn.style.display = ppData.compared ? 'none' : '';
        warn.textContent = '이 달은 근무표(정본)가 아직 올라오지 않아 대조가 수행되지 않았습니다. '
                         + '아래 목록은 근무보고서 기준일 뿐, 오류 0건은 「이상 없음」이 아닙니다.';
    }

    document.getElementById('ppRows').innerHTML = rows.length
      ? rows.map(function(r){
          var types = Object.keys(r.by_type || {}).map(function(t){
              return '<span class="badge badge-diff ' + (TYPE_CLS[t] || 'bg-secondary')
                   + ' me-1">' + t + ' ' + r.by_type[t] + '</span>'; }).join('');
          var tr = '<tr class="' + (r.errors ? '' : 'zero ') + (openName === r.name ? 'open' : '')
                 + '" onclick="svToggle(\'' + r.name + '\')">'
                 + '<td><b>' + r.name + '</b></td>'
                 + '<td>' + (r.dept || '-') + '</td>'
                 + '<td>' + (r.group || '-') + '</td>'
                 + '<td class="pp-num">' + (r.checked != null ? r.checked : r.days) + '</td>'
                 + '<td class="pp-num">' + r.tag_days + '</td>'
                 + '<td class="pp-num ' + (r.errors ? 'text-danger fw-bold' : '') + '">'
                 +   r.errors + '</td>'
                 + '<td>' + (types || '<span class="text-success">✅</span>') + '</td>'
                 + '<td class="pp-num">' + r.rate.toFixed(1) + '%</td></tr>';
          if (openName === r.name) {
              tr += '<tr class="detail-wrap"><td colspan="8" class="p-0">'
                  + '<div id="svDetail" class="p-2">불러오는 중…</div></td></tr>';
          }
          return tr;
        }).join('')
      : '<tr><td colspan="8" class="text-muted py-4 text-center">해당 조건의 인원이 없습니다.</td></tr>';

    if (openName) svDetail(openName);
}

// ═══ 개인 상세 (일자별 3소스) ═══
function svToggle(name) {
    openName = (openName === name) ? null : name;
    ppRender();
}

function svDetail(name) {
    var box = document.getElementById('svDetail');
    if (!box) return;
    if (svCache[name]) { svPaint(box, svCache[name]); return; }
    var m = document.getElementById('svMonth').value;
    fetch('/api/source_verify?month=' + encodeURIComponent(m) + '&name=' + encodeURIComponent(name))
      .then(function(r){ return r.json(); })
      .then(function(d) {
        if (!d.ok) { box.innerHTML = '<div class="text-danger">' + (d.error||'오류') + '</div>'; return; }
        svCache[name] = d;
        svPaint(box, d);
      })
      .catch(function(e){ box.innerHTML = '<div class="text-danger">상세 조회 실패: ' + e + '</div>'; });
}

function svVerdict(x) {
    // 당일·미래는 아직 취합 전이라 판정하지 않음
    if (x.pending)
        return {bad: false, html: '<span class="badge badge-diff bg-light text-muted border">작성중</span>'};
    if (x.diff && !x.diff.resolved) {
        var t = x.diff.type;
        return {bad: true, html: '<span class="badge badge-diff ' + (TYPE_CLS[t] || 'bg-secondary')
              + '">' + t + '</span>'
              + (x.diff.note ? ' <span class="sv-t">' + x.diff.note + '</span>' : '')};
    }
    if (x.diff && x.diff.resolved)
        return {bad: false, html: '<span class="badge badge-diff bg-light text-muted border">해소됨</span>'};
    if (!x.rep && !x.mod && !x.xl) return {bad: false, html: '<span class="text-muted">-</span>'};
    return {bad: false, html: '<span class="text-success">✅</span>'};
}

function svPaint(box, d) {
    var days = d.days || [];
    var bad = days.filter(function(x){ return !x.pending && x.diff && !x.diff.resolved; }).length;
    function cell(v, etc, k) {
        if (!v && !etc) return '<span class="text-muted">-</span>';
        return '<span class="sv-src ' + k + '">' + (v||'') + '</span>'
             + (etc ? ' <span class="sv-etc">' + etc + '</span>' : '');
    }
    box.innerHTML =
        '<div class="d-flex justify-content-between align-items-center mb-1">'
      +   '<span style="font-size:0.82rem;"><b>' + d.info.name + '</b> 일자별 3소스 — 오류 '
      +     '<b class="' + (bad?'text-danger':'text-success') + '">' + bad + '</b>건</span>'
      +   '<button class="btn btn-sm btn-outline-secondary py-0" style="font-size:0.72rem;"'
      +     ' onclick="event.stopPropagation();svCsv(\'' + d.info.name + '\')">CSV</button>'
      + '</div>'
      + '<div style="max-height:420px;overflow-y:auto;"><table class="sv-tbl">'
      + '<thead><tr><th style="text-align:left;">일자</th><th>근무표<br>'
      +   '<span class="text-muted" style="font-weight:400;">정본</span></th>'
      +   '<th>근무보고서</th><th>수정보고서</th><th>출근~퇴근</th><th>판정</th></tr></thead><tbody>'
      + days.map(function(x){
          var v = svVerdict(x);
          var cls = [];
          if (x.weekend) cls.push('we');
          if (x.holiday) cls.push('hol');
          if (v.bad) cls.push('bad');
          var tg = x.tag ? (hhmm(x.tag.in) + '~' + hhmm(x.tag.out)
                          + ' <span class="sv-t">(' + x.tag.cnt + ')</span>')
                         : '<span class="text-muted">-</span>';
          return '<tr class="' + cls.join(' ') + '">'
               + '<td class="d"><a href="#" class="day-link" onclick="wrOpen(\''
               +   d.info.name + '\',\'' + d.month + '-'
               +   String(x.day).padStart(2,'0') + '\');return false;">'
               +   x.day + '일 (' + x.dow + ')</a></td>'
               + '<td>' + cell(x.xl,'','sv-x') + '</td>'
               + '<td>' + cell(x.rep,x.rep_etc,'sv-r') + '</td>'
               + '<td>' + cell(x.mod,x.mod_etc,'sv-m') + '</td>'
               + '<td class="sv-t">' + tg + '</td>'
               + '<td>' + v.html + '</td></tr>';
        }).join('')
      + '</tbody></table></div>';
}

// ═══ 일자 클릭 → 그날 근무보고서 보기 ═══
var wrModal = null;

function wrOpen(name, date) {
    if (!wrModal) wrModal = new bootstrap.Modal(document.getElementById('wrModal'));
    document.getElementById('wrTitle').textContent = name + ' — ' + date + ' 근무보고서';
    document.getElementById('wrBody').innerHTML = '불러오는 중…';
    wrModal.show();
    fetch('/api/wr_reports_of_day?name=' + encodeURIComponent(name)
          + '&date=' + encodeURIComponent(date))
      .then(function(r){ return r.json(); })
      .then(function(d) {
        var box = document.getElementById('wrBody');
        if (!d.ok) { box.innerHTML = '<div class="text-danger">' + (d.error||'오류') + '</div>'; return; }
        var reps = d.reports || [];
        if (!reps.length) {
            box.innerHTML = '<div class="text-muted py-3">해당 날짜에 작성된 근무보고서가 없습니다.'
                          + (d.msg ? '<br><span style="font-size:.85em;">' + d.msg + '</span>' : '')
                          + '</div>';
            return;
        }
        box.innerHTML = reps.map(function(r){
            // 이 사람이 배정된 칸
            var mine = (r.mine || []).map(function(m){
                return m.category + (m.etc ? ' (' + m.etc + ')' : '')
                     + (m.deduction ? ' 공제' + m.deduction : '')
                     + (m.skipped ? ' [스킵]' : '');
            }).join(', ') || '<span class="text-danger">배정 없음</span>';

            var cats = Object.keys(r.by_cat || {}).map(function(c){
                var names = r.by_cat[c].map(function(u){
                    return u === name ? '<span class="wr-mine">' + u + '</span>' : u;
                }).join(', ');
                return '<div class="wr-cat"><span class="k">' + c + ' ('
                     + r.by_cat[c].length + ')</span><span class="v">' + names + '</span></div>';
            }).join('');

            return '<div class="wr-card' + (r.is_final ? ' final' : '') + '">'
                 + '<div class="wr-head"><span><b>' + r.label + '</b>'
                 +   (r.is_final ? ' <span class="badge bg-primary" style="font-size:.65rem;">최종 적용</span>' : '')
                 +   ' <span class="text-muted">· ' + r.group + ' · ' + r.status + '</span></span>'
                 + '<span class="text-muted">' + r.writer + ' · ' + r.created + '</span></div>'
                 + '<div class="wr-body">'
                 +   '<div style="font-size:.82rem;margin-bottom:6px;">'
                 +     '<b>' + name + '</b> 배정: ' + mine + '</div>'
                 +   cats
                 +   (r.memo ? '<div class="text-muted mt-2" style="font-size:.76rem;">메모: '
                              + r.memo + '</div>' : '')
                 + '</div></div>';
        }).join('')
        + '<div class="text-muted" style="font-size:.74rem;">'
        + '수정보고서가 있으면 <b>가장 마지막에 작성된 것</b>이 최종 적용됩니다. '
        + '노란 표시는 조회 중인 인원입니다.</div>';
      })
      .catch(function(e){
        document.getElementById('wrBody').innerHTML =
            '<div class="text-danger">조회 실패: ' + e + '</div>';
      });
}

// ═══ CSV ═══
function dl(name, lines) {
    var blob = new Blob(["﻿" + lines.join("\n")], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

function ppCsv() {
    var rows = ppFiltered();
    if (!rows.length) { alert('내려받을 내용이 없습니다.'); return; }
    var lines = [['이름','부서','그룹','점검일수','출입일수','오류','오류유형','일치율'].join(',')]
      .concat(rows.map(function(r){
        var t = Object.keys(r.by_type||{}).map(function(k){ return k+' '+r.by_type[k]; }).join(' ');
        return [r.name,r.dept,r.group,(r.checked!=null?r.checked:r.days),r.tag_days,r.errors,t,r.rate+'%']
               .map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(',');
      }));
    dl('3소스검증_전원_' + document.getElementById('svMonth').value + '.csv', lines);
}

function svCsv(name) {
    var d = svCache[name];
    if (!d) { alert('먼저 상세를 여세요.'); return; }
    var lines = [['일자','요일','근무표','근무보고서','수정보고서','출근','퇴근','판정'].join(',')]
      .concat(d.days.map(function(x){
        var v = x.diff && !x.diff.resolved ? x.diff.type : (x.diff ? '해소됨' : '일치');
        return [x.day,x.dow,x.xl,x.rep,x.mod,
                x.tag?hhmm(x.tag.in):'', x.tag?hhmm(x.tag.out):'', v]
               .map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(',');
      }));
    dl('3소스검증_' + name + '_' + d.month + '.csv', lines);
}

document.addEventListener('DOMContentLoaded', ppLoad);
</script>
</body>
</html>
