<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}?v=14" rel="stylesheet">
</head>
<body class="login-bg">
<div class="login-card">
    <div class="card">
        <div class="card-body p-4 p-md-5">
            <div class="login-brand">🔑</div>
            <h4 class="text-center fw-bold mb-4">비밀번호 변경</h4>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
                {{ message }}
                <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">현재 비밀번호</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">새 비밀번호</label>
                    <input type="password" name="new_password" class="form-control" minlength="4" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">새 비밀번호 확인</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="4" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">변경</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-muted small">← 메인으로</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
