<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — 태인관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
<style>
.esg-hero {
    min-height: calc(100vh - 200px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
}
.esg-icon {
    font-size: 5rem; margin-bottom: 18px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
}
.esg-title { font-size: 1.9rem; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.esg-sub   { font-size: 1rem; color: #64748b; margin-bottom: 28px; }
.esg-badge {
    display: inline-block; background: #fff3cd; color: #856404;
    padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    border: 1px solid #ffeaa7; margin-bottom: 20px;
}
.esg-scope {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 20px 24px; max-width: 520px; text-align: left; box-shadow: var(--shadow-sm);
}
.esg-scope h6 { font-weight: 700; color: #1e293b; margin-bottom: 10px; font-size: 0.9rem; }
.esg-scope ul { margin: 0; padding-left: 18px; color: #475569; font-size: 0.86rem; line-height: 1.9; }
.esg-scope li::marker { color: #94a3b8; }
</style>
</head>
<body>
{% include "_sidebar.html" %}
<div class="main-content">

<div class="esg-hero">
  <div class="esg-icon">{{ page_icon }}</div>
  <span class="esg-badge">🚧 준비중</span>
  <div class="esg-title">{{ page_title }}</div>
  <div class="esg-sub">{{ page_sub }}</div>

  {% if scope_items %}
  <div class="esg-scope">
    <h6>📋 예정된 구성 항목</h6>
    <ul>
      {% for item in scope_items %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>

</div><!-- /main-content -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
