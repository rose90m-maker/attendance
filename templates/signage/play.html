<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ display_name or '디지털 사이니지' }} — 송출</title>
    <link rel="icon" type="image/gif" href="/static/LOGO.GIF">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%; height: 100vh; overflow: hidden;
            background: #000; color: #fff;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            cursor: none;       /* TV: 마우스 숨김 */
        }

        /* 메인 스테이지 — 한 화면에 하나의 콘텐츠 */
        #stage {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 멀티존 레이아웃 */
        #layoutStage {
            position: fixed; inset: 0;
            background: #000;
        }
        .layout-zone {
            position: absolute; overflow: hidden;
            background: #000;
        }
        .layout-zone .c-text { font-size: 3vw; padding: 1vw; }

        /* 텍스트 콘텐츠 */
        .c-text {
            font-size: 6vw; font-weight: 800;
            text-align: center; line-height: 1.4;
            padding: 4vw 6vw; max-width: 90%;
            word-break: keep-all;
        }

        /* 이미지 */
        .c-image {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .c-image img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
        }

        /* 웹 URL */
        .c-web { width: 100%; height: 100%; border: 0; }

        /* 영상 */
        .c-video {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .c-video video {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
        }

        /* PDF */
        .c-pdf {
            width: 100%; height: 100%; background: #fff;
        }
        .c-pdf embed, .c-pdf iframe {
            width: 100%; height: 100%; border: 0;
        }

        /* 긴급공지 */
        .c-emergency {
            position: fixed; inset: 0;
            background: var(--em-bg, #dc2626);
            color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6vw; text-align: center;
            animation: emerg-pulse 1.5s ease-in-out infinite;
        }
        @keyframes emerg-pulse {
            0%, 100% { background: var(--em-bg, #dc2626); }
            50% { background: var(--em-bg-pulse, #991b1b); }
        }
        .c-emergency .em-icon { font-size: 12vw; margin-bottom: 2vw; }
        .c-emergency .em-title { font-size: 8vw; font-weight: 900; margin-bottom: 2vw; }
        .c-emergency .em-body { font-size: 4vw; line-height: 1.4; }
        .c-emergency img { max-width: 40%; max-height: 30%; margin-top: 3vw; }

        /* 🎂 생일자 콘텐츠 (subtype=birthday) */
        .c-birthday {
            position: fixed; inset: 0;
            background: var(--bg, #fbbf24); color: var(--fg, #0f172a);
            display: flex; flex-direction: column;
            padding: 3vh 4vw 4vh;
        }
        .bday-h {
            text-align:center; font-weight:900; font-size:5vw;
            letter-spacing:0.05em; padding:1.2vh 0;
            line-height: 1.0;
        }
        .bday-h .em { color: var(--accent, #dc2626); font-size:5.5vw; }
        .bday-g {
            flex:1; display:grid; gap:2vw;
            place-items:center; align-content:center;
        }
        .bday-cd {
            background: rgba(255,255,255,0.88);
            border-radius: 2vw; padding: 2vw 3vw;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; min-width:0; max-width:100%; max-height:100%;
            box-shadow: 0 0.6vw 2.5vw rgba(0,0,0,0.18);
            color: var(--fg, #0f172a);
            box-sizing: border-box;
        }
        .bday-cd .ck { line-height:1; margin-bottom:0.5vw; }
        .bday-cd .nm { font-weight:900; line-height:1.1; word-break:keep-all; }
        .bday-cd .dp { opacity:0.65; margin-top:0.8vw; font-weight:500; }
        /* 인원수별 그리드 */
        .bday-g[data-n="1"] { grid-template-columns: 1fr; }
        .bday-g[data-n="1"] .bday-cd .nm { font-size: 18vw; }
        .bday-g[data-n="1"] .bday-cd .ck { font-size: 10vw; }
        .bday-g[data-n="1"] .bday-cd .dp { font-size: 3vw; }
        .bday-g[data-n="2"] { grid-template-columns: 1fr 1fr; }
        .bday-g[data-n="2"] .bday-cd .nm { font-size: 11vw; }
        .bday-g[data-n="2"] .bday-cd .ck { font-size: 7vw; }
        .bday-g[data-n="2"] .bday-cd .dp { font-size: 2.4vw; }
        .bday-g[data-n="3"] { grid-template-columns: repeat(3,1fr); }
        .bday-g[data-n="3"] .bday-cd .nm { font-size: 8vw; }
        .bday-g[data-n="3"] .bday-cd .ck { font-size: 5.5vw; }
        .bday-g[data-n="3"] .bday-cd .dp { font-size: 2.1vw; }
        .bday-g[data-n="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .bday-g[data-n="4"] .bday-cd .nm { font-size: 7.5vw; }
        .bday-g[data-n="4"] .bday-cd .ck { font-size: 4.5vw; }
        .bday-g[data-n="4"] .bday-cd .dp { font-size: 2vw; }
        .bday-g[data-n="5"], .bday-g[data-n="6"] {
            grid-template-columns: repeat(3,1fr); grid-template-rows: 1fr 1fr;
        }
        .bday-g[data-n="5"] .bday-cd .nm,
        .bday-g[data-n="6"] .bday-cd .nm { font-size: 6vw; }
        .bday-g[data-n="5"] .bday-cd .ck,
        .bday-g[data-n="6"] .bday-cd .ck { font-size: 3.5vw; }
        .bday-g[data-n="5"] .bday-cd .dp,
        .bday-g[data-n="6"] .bday-cd .dp { font-size: 1.7vw; }
        .bday-g[data-n="7"], .bday-g[data-n="8"] {
            grid-template-columns: repeat(4,1fr); grid-template-rows: 1fr 1fr;
        }
        .bday-g[data-n="7"] .bday-cd .nm,
        .bday-g[data-n="8"] .bday-cd .nm { font-size: 4.6vw; }
        .bday-g[data-n="7"] .bday-cd .ck,
        .bday-g[data-n="8"] .bday-cd .ck { font-size: 2.8vw; }
        .bday-g[data-n="7"] .bday-cd .dp,
        .bday-g[data-n="8"] .bday-cd .dp { font-size: 1.4vw; }
        .bday-g[data-n="9"], .bday-g[data-n="10"] {
            grid-template-columns: repeat(5,1fr); grid-template-rows: 1fr 1fr;
        }
        .bday-g[data-n="9"] .bday-cd .nm,
        .bday-g[data-n="10"] .bday-cd .nm { font-size: 3.9vw; }
        .bday-g[data-n="9"] .bday-cd .ck,
        .bday-g[data-n="10"] .bday-cd .ck { font-size: 2.4vw; }
        .bday-g[data-n="9"] .bday-cd .dp,
        .bday-g[data-n="10"] .bday-cd .dp { font-size: 1.2vw; }

        /* 떠다니는 색종이 */
        .confetti {
            position:absolute; pointer-events:none; font-size: 3vw;
            animation: cfup linear infinite;
        }
        @keyframes cfup {
            0%   { transform: translateY(110vh) rotate(0deg); opacity:0; }
            10%  { opacity:0.85; }
            100% { transform: translateY(-15vh) rotate(900deg); opacity:0; }
        }

        /* 빈 상태 / 에러 */
        .c-empty {
            color: #475569; font-size: 3vw; text-align: center;
        }
        .c-empty .icon { font-size: 8vw; opacity: 0.3; }
        .c-empty .label { margin-top: 2vw; }

        /* 디버그 오버레이 (?debug=1) */
        .debug-overlay {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: #94a3b8;
            font-family: monospace; font-size: 0.75rem;
            padding: 6px 10px; border-radius: 2px; z-index: 9999;
        }

        /* 상태 인디케이터 (좌측 상단, 항상 표시 — 작게) */
        .status-dot {
            position: fixed; top: 8px; left: 8px;
            width: 8px; height: 8px; border-radius: 50%;
            background: #16a34a; box-shadow: 0 0 4px rgba(22,163,74,0.4);
            opacity: 0.4; z-index: 9998;
        }
        .status-dot.disconnected { background: #dc2626; opacity: 0.8; }
    </style>
    <!-- QR 렌더 (canvas 에디터 위젯용) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
</head>
<body>
    <div id="stage">
        <div class="c-empty">
            <div class="icon">⏳</div>
            <div class="label">콘텐츠 로딩 중…</div>
        </div>
    </div>

    <div class="status-dot" id="statusDot"></div>
    <div class="debug-overlay" id="debugOverlay" style="display:none;"></div>

<script>
const TOKEN = "{{ token }}";
const DISPLAY_ID = {{ display_id }};
const DEBUG = new URLSearchParams(location.search).has('debug');

if (DEBUG) document.getElementById('debugOverlay').style.display = 'block';

let currentItems = [];     // 현재 플레이리스트 항목
let currentIdx = 0;
let currentEmergency = null;
let currentPlaylistId = null;
let currentLoopMode = 'sequential';
let currentLayout = null;  // {id, name, template_type, zones: [...]}
let lastPollHash = null;   // 변경 감지용
let playTimer = null;
let logStartTime = null;
let lastNetworkOk = true;

const stage = document.getElementById('stage');
const statusDot = document.getElementById('statusDot');
const debugEl = document.getElementById('debugOverlay');

function setStatus(connected) {
    if (connected) {
        statusDot.classList.remove('disconnected');
        lastNetworkOk = true;
    } else {
        statusDot.classList.add('disconnected');
        lastNetworkOk = false;
    }
}

function debug(msg) {
    if (DEBUG) {
        const t = new Date().toLocaleTimeString();
        debugEl.textContent = `[${t}] ${msg}`;
        console.log(msg);
    }
}

// ─── 콘텐츠 렌더링 ─────────────────────────────────
function renderContent(item) {
    if (!item) {
        stage.innerHTML = `<div class="c-empty">
            <div class="icon">📺</div>
            <div class="label">대기 중 — 콘텐츠가 등록되지 않았습니다</div>
        </div>`;
        return;
    }

    // 🎂 생일자 subtype
    if (item.meta && item.meta.subtype === 'birthday' && Array.isArray(item.meta.names)) {
        renderBirthday(item);
        return;
    }
    // 🎨 슬라이드 subtype (파워포인트형 자유 배치)
    if (item.meta && item.meta.subtype === 'slide' && Array.isArray(item.meta.elements)) {
        renderSlide(item);
        return;
    }
    // 📝 블록형 subtype (Notion 스타일)
    if (item.meta && item.meta.subtype === 'blocks' && Array.isArray(item.meta.blocks)) {
        renderBlocks(item);
        return;
    }
    // 🆕 BlockNote 에디터 subtype (HTML 직접 렌더)
    if (item.meta && item.meta.subtype === 'blocknote' && item.meta.body_html) {
        renderBlockNoteHtml(item);
        return;
    }
    // 🎨 Canvas 에디터 subtype (project + pages 자유 배치)
    if (item.meta && item.meta.subtype === 'canvas' && item.meta.project) {
        renderCanvas(item);
        return;
    }

    let html = '';
    if (item.type === 'text') {
        const body = (item.body_text || item.title || '').replace(/\n/g, '<br>');
        html = `<div class="c-text">${body}</div>`;
    } else if (item.type === 'image' && item.file_path) {
        html = `<div class="c-image"><img src="/signage/uploads/${item.file_path}" alt=""></div>`;
    } else if (item.type === 'web' && item.web_url) {
        html = `<iframe class="c-web" src="${item.web_url}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
    } else if (item.type === 'video' && item.file_path) {
        // muted + autoplay (TV 자동재생 정책 우회) + loop는 duration 처리에 맡김
        html = `<div class="c-video"><video src="/signage/uploads/${item.file_path}" autoplay muted playsinline></video></div>`;
    } else if (item.type === 'pdf' && item.file_path) {
        // PDF는 브라우저 내장 뷰어 사용 (#toolbar=0 으로 깔끔하게)
        html = `<div class="c-pdf"><embed src="/signage/uploads/${item.file_path}#toolbar=0&navpanes=0&view=FitH" type="application/pdf"></div>`;
    } else {
        html = `<div class="c-empty">
            <div class="icon">❓</div>
            <div class="label">${item.type} 유형 미지원 또는 파일 없음</div>
        </div>`;
    }
    stage.innerHTML = html;

    // 영상은 끝나면 다음 항목으로 자동 진행 (duration_sec보다 영상이 짧을 때)
    if (item.type === 'video') {
        const v = stage.querySelector('video');
        if (v) {
            v.addEventListener('ended', () => {
                if (currentItems.length > 1) {
                    clearTimeout(playTimer);
                    currentIdx = (currentIdx + 1) % currentItems.length;
                    playNext();
                } else {
                    // 단일 영상이면 루프
                    v.currentTime = 0; v.play();
                }
            });
            v.addEventListener('error', () => {
                debug(`video 로드 실패: ${item.file_path}`);
            });
        }
    }
}

function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 캔버스 에디터: project.pages를 viewport에 맞춰 transform scale로 렌더
function renderCanvas(item) {
    const proj = item.meta.project;
    const bg = item.meta.bg_color || '#0f172a';
    if (!proj || !proj.pages || proj.pages.length === 0) {
        stage.innerHTML = `<div class="c-empty"><div class="icon">🎨</div><div class="label">캔버스 데이터 없음</div></div>`;
        return;
    }
    // 첫 페이지 렌더 — 다중 페이지는 setTimeout으로 자동 전환
    let pageIdx = 0;
    let pageTimer = null;
    const renderOnePage = () => {
        const page = proj.pages[pageIdx];
        if (!page) return;
        const W = proj.width || 1920, H = proj.height || 1080;
        // viewport에 맞춰 스케일 계산 (4K TV는 1:1, 작은 화면이면 축소)
        const vw = window.innerWidth, vh = window.innerHeight;
        const scale = Math.min(vw / W, vh / H);
        let html = `<div style="position:fixed;inset:0;background:${bg};display:flex;align-items:center;justify-content:center;overflow:hidden;">
            <div style="width:${W}px;height:${H}px;position:relative;background:${page.background || '#ffffff'};
                 transform:scale(${scale});transform-origin:center center;flex-shrink:0;">`;
        const sorted = [...(page.elements || [])].sort((a, b) => (a.zIndex||0) - (b.zIndex||0));
        for (const el of sorted) {
            if (el.hidden) continue;
            const st = `position:absolute;left:${el.x}px;top:${el.y}px;width:${el.width}px;height:${el.height}px;
                opacity:${el.opacity};z-index:${el.zIndex||0};
                transform:rotate(${el.rotation||0}deg);transform-origin:center center;`;
            const p = el.props || {};
            if (el.type === 'text') {
                const just = p.textAlign === 'right' ? 'flex-end' : p.textAlign === 'center' ? 'center' : 'flex-start';
                html += `<div style="${st};font-size:${p.fontSize}px;color:${p.color};
                    background:${p.backgroundColor||'transparent'};
                    font-weight:${p.fontWeight||400};font-style:${p.fontStyle||'normal'};
                    text-align:${p.textAlign||'left'};line-height:${p.lineHeight||1.4};
                    padding:${p.padding ?? 8}px;border-radius:${p.borderRadius||0}px;
                    display:flex;align-items:center;justify-content:${just};
                    word-break:keep-all;white-space:pre-wrap;overflow:hidden;box-sizing:border-box;">${escapeHtml(p.content||'')}</div>`;
            } else if (el.type === 'image') {
                const fit = p.fit === 'stretch' ? 'fill' : (p.fit || 'contain');
                html += `<div style="${st}"><img src="${escapeHtml(p.src)}" style="width:100%;height:100%;object-fit:${fit};display:block;border-radius:${p.borderRadius||0}px;"></div>`;
            } else if (el.type === 'video') {
                const fit = p.fit === 'stretch' ? 'fill' : (p.fit || 'contain');
                const ap = p.autoplay !== false ? 'autoplay' : '';
                const lp = p.loop !== false ? 'loop' : '';
                const mu = p.muted !== false ? 'muted' : '';
                html += `<div style="${st}"><video src="${escapeHtml(p.src)}" ${ap} ${lp} ${mu} playsinline style="width:100%;height:100%;object-fit:${fit};display:block;"></video></div>`;
            } else if (el.type === 'shape') {
                if (p.kind === 'circle') {
                    html += `<div style="${st};background:${p.fill};border-radius:50%;${p.stroke ? `border:${p.strokeWidth||1}px solid ${p.stroke};`:''}"></div>`;
                } else if (p.kind === 'line') {
                    html += `<div style="${st};height:0;border-top:${p.strokeWidth||2}px solid ${p.stroke||p.fill};margin-top:${el.height/2}px;"></div>`;
                } else {
                    html += `<div style="${st};background:${p.fill};border-radius:${p.borderRadius||0}px;${p.stroke ? `border:${p.strokeWidth||1}px solid ${p.stroke};`:''}"></div>`;
                }
            } else if (el.type === 'widget' && p.kind === 'clock') {
                const id = 'cv_clk_' + el.id;
                const showDate = p.config?.showDate !== false;
                html += `<div style="${st};display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.4);">
                    <div id="${id}_time" style="font-size:${el.height*0.46}px;font-weight:900;line-height:1;letter-spacing:0.05em;">--:--</div>
                    ${showDate ? `<div id="${id}_date" style="font-size:${el.height*0.12}px;opacity:0.85;margin-top:${el.height*0.04}px;">----.--.--</div>` : ''}
                </div>`;
            } else if (el.type === 'widget' && p.kind === 'qrcode') {
                const id = 'cv_qr_' + el.id;
                html += `<div style="${st};background:#fff;display:flex;align-items:center;justify-content:center;padding:${Math.min(el.width,el.height)*0.05}px;">
                    <canvas id="${id}" style="width:100%;height:100%;"></canvas>
                </div>`;
            }
        }
        html += `</div></div>`;
        stage.innerHTML = html;

        // 시계 위젯 갱신
        const updateClocks = () => {
            for (const el of sorted) {
                if (el.type === 'widget' && (el.props||{}).kind === 'clock') {
                    const id = 'cv_clk_' + el.id;
                    const t = document.getElementById(id + '_time');
                    const d = document.getElementById(id + '_date');
                    if (t) {
                        const now = new Date();
                        const hh = String(now.getHours()).padStart(2,'0');
                        const mm = String(now.getMinutes()).padStart(2,'0');
                        const ss = String(now.getSeconds()).padStart(2,'0');
                        t.innerHTML = `${hh}:${mm}<span style="opacity:0.6">:${ss}</span>`;
                        if (d) {
                            const weeks = ['일','월','화','수','목','금','토'];
                            d.textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${weeks[now.getDay()]})`;
                        }
                    }
                }
            }
        };
        updateClocks();
        // 매 페이지 렌더마다 인터벌 재설정 (간소화)
        if (window._clockTimer) clearInterval(window._clockTimer);
        window._clockTimer = setInterval(updateClocks, 1000);

        // QR 렌더 (CDN 스크립트가 로드되어 있다면)
        for (const el of sorted) {
            if (el.type === 'widget' && (el.props||{}).kind === 'qrcode') {
                const id = 'cv_qr_' + el.id;
                const canvas = document.getElementById(id);
                if (canvas && window.QRCode) {
                    try { window.QRCode.toCanvas(canvas, el.props.config?.url || ' ', { width: 600, margin: 1 }, ()=>{}); } catch(e){}
                }
            }
        }

        // 다음 페이지 전환
        if (proj.pages.length > 1) {
            if (pageTimer) clearTimeout(pageTimer);
            pageTimer = setTimeout(() => {
                pageIdx = (pageIdx + 1) % proj.pages.length;
                renderOnePage();
            }, (page.duration || 8) * 1000);
        }
    };
    renderOnePage();
}

function renderBlockNoteHtml(item) {
    const m = item.meta;
    const bg = m.bg_color || '#0f172a';
    // 글자색 자동 (배경 어두우면 흰색, 밝으면 검정)
    const isDark = (() => {
        const h = bg;
        if (!h || h[0] !== '#') return true;
        const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
        return (0.299*r + 0.587*g + 0.114*b) < 160;
    })();
    // TV: 3840x2160 native — 동일한 px 단위 사용 (에디터 미리보기와 1:1 일치)
    stage.innerHTML = `<div style="position:fixed;inset:0;background:${bg};overflow:hidden;padding:80px 120px;color:${isDark ? '#fff' : '#0f172a'};font-size:56px;line-height:1.5;font-family:'Noto Sans KR',sans-serif;">
        <style>
            .bn-tv h1 { font-size: 160px; font-weight:800; margin:16px 0; line-height:1.2; }
            .bn-tv h2 { font-size: 120px; font-weight:700; margin:14px 0; line-height:1.25; }
            .bn-tv h3 { font-size: 90px; font-weight:700; margin:12px 0; line-height:1.3; }
            .bn-tv p { margin:16px 0; }
            .bn-tv ul, .bn-tv ol { padding-left:80px; margin:16px 0; }
            .bn-tv li { margin:8px 0; }
            .bn-tv img { max-width:100%; max-height:1400px; object-fit:contain; display:block; margin:24px auto; }
            .bn-tv video { max-width:100%; max-height:1400px; display:block; margin:24px auto; }
            .bn-tv table { border-collapse:collapse; width:100%; margin:24px 0; table-layout:fixed; }
            .bn-tv td, .bn-tv th { border:2px solid rgba(${isDark ? '255,255,255' : '0,0,0'},0.4); padding:18px 28px; font-size:52px; vertical-align:top; word-break:keep-all; }
            .bn-tv a { color: ${isDark ? '#fbbf24' : '#1e40af'}; }
            .bn-tv blockquote { border-left:12px solid #fbbf24; padding:24px 48px; margin:24px 0; font-style:italic; background:rgba(127,127,127,0.1); }
            .bn-tv pre { background:#0f172a; color:#e2e8f0; padding:28px 36px; border-radius:12px; font-family:'D2Coding',monospace; font-size:44px; margin:24px 0; }
            .bn-tv code { background:rgba(${isDark ? '255,255,255' : '0,0,0'},0.15); padding:4px 10px; border-radius:6px; font-family:'D2Coding',monospace; }
        </style>
        <div class="bn-tv">${m.body_html}</div>
    </div>`;
}

function renderBlocks(item) {
    const m = item.meta;
    const bg = m.bg_color || '#0f172a';
    const blocks = m.blocks || [];
    const mainBlocks = blocks.filter(b => b.type !== 'ticker');
    const tickers = blocks.filter(b => b.type === 'ticker');

    let body = '';
    for (const b of mainBlocks) {
        const s = b.style || {};
        const css = [];
        if (s.font_size) css.push(`font-size:${s.font_size}vw`);
        if (s.bold) css.push('font-weight:800');
        if (s.italic) css.push('font-style:italic');
        if (s.align) css.push(`text-align:${s.align}`);
        if (s.color) css.push(`color:${s.color}`);
        if (s.bg && s.bg !== 'transparent') css.push(`background:${s.bg}`);
        if (s.padding) css.push(`padding:${s.padding}vw`);
        const just = s.align === 'left' ? 'flex-start' : s.align === 'right' ? 'flex-end' : 'center';
        css.push('display:flex;', `justify-content:${just}`, 'align-items:center', 'word-break:keep-all', 'overflow:hidden');
        const styleStr = css.join(';');

        if (b.type === 'heading' || b.type === 'text') {
            body += `<div style="${styleStr}">${escapeHtml(b.content||'').replace(/\n/g,'<br>')}</div>`;
        } else if (b.type === 'image' && b.url) {
            const fit = b.fit || 'contain';
            body += `<div style="${styleStr};flex:1;min-height:10vw;"><img src="${escapeHtml(b.url)}" style="max-width:100%;max-height:100%;object-fit:${fit};"></div>`;
        } else if (b.type === 'video' && b.url) {
            const fit = b.fit || 'contain';
            const ap = b.autoplay !== false ? 'autoplay' : '';
            const lp = b.loop !== false ? 'loop' : '';
            const mu = b.muted !== false ? 'muted' : '';
            body += `<div style="${styleStr};flex:1;min-height:10vw;"><video src="${escapeHtml(b.url)}" ${ap} ${lp} ${mu} playsinline style="max-width:100%;max-height:100%;object-fit:${fit};"></video></div>`;
        } else if (b.type === 'pdf' && b.url) {
            body += `<div style="${styleStr};flex:1;min-height:15vw;"><embed src="${escapeHtml(b.url)}#toolbar=0&navpanes=0" type="application/pdf" style="width:100%;height:100%;"></div>`;
        } else if (b.type === 'web' && b.url) {
            if (b.mode === 'card') {
                const hostMatch = b.url.match(/^https?:\/\/([^/]+)/);
                const host = hostMatch ? hostMatch[1] : b.url;
                body += `<div style="${styleStr};"><div style="background:rgba(255,255,255,0.95);color:#0f172a;border-radius:0.6vw;padding:1.5vw;max-width:80%;">
                    <div style="font-weight:800;font-size:2vw;">${escapeHtml(b.card_title || host)}</div>
                    ${b.card_desc ? `<div style="font-size:1.2vw;opacity:0.7;margin-top:0.5vw;">${escapeHtml(b.card_desc)}</div>` : ''}
                    <div style="font-size:0.9vw;color:#1e40af;margin-top:0.5vw;">🔗 ${escapeHtml(b.url)}</div>
                </div></div>`;
            } else {
                body += `<div style="${styleStr};flex:1;min-height:15vw;"><iframe src="${escapeHtml(b.url)}" sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:100%;border:0;"></iframe></div>`;
            }
        } else if (b.type === 'divider') {
            const c = s.color || '#94a3b8';
            const p = s.padding || 0.5;
            body += `<div style="border-bottom:0.25vw solid ${c};opacity:0.5;margin:${p}vw 2vw;"></div>`;
        } else if (b.type === 'table') {
            let tableHtml = '<table style="border-collapse:collapse;width:100%;height:100%;">';
            for (const row of (b.cells || [])) {
                tableHtml += '<tr>';
                for (const cell of row) {
                    if (cell._covered) continue;
                    const cspan = cell.colspan ? ` colspan="${cell.colspan}"` : '';
                    const rspan = cell.rowspan ? ` rowspan="${cell.rowspan}"` : '';
                    const cellCss = [
                        'border:1px solid rgba(255,255,255,0.3)',
                        'padding:0.4vw 0.8vw',
                        `text-align:${cell.align||s.align||'center'}`,
                        cell.bold ? 'font-weight:800' : '',
                        cell.bg ? `background:${cell.bg}` : '',
                        cell.color ? `color:${cell.color}` : '',
                    ].filter(Boolean).join(';');
                    tableHtml += `<td${cspan}${rspan} style="${cellCss};">${escapeHtml(cell.text||'')}</td>`;
                }
                tableHtml += '</tr>';
            }
            tableHtml += '</table>';
            body += `<div style="${styleStr};flex:1;">${tableHtml}</div>`;
        } else if (b.type === 'quote') {
            body += `<div style="border-left:0.4vw solid #fbbf24;background:rgba(255,255,255,0.08);
                padding:1vw 2vw;margin:0.5vw 0;color:#fff;font-style:italic;font-size:${(s.font_size||3)}vw;">
                <div>"${escapeHtml(b.content||'').replace(/<[^>]+>/g,'')}"</div>
                ${b.author ? `<div style="font-style:normal;font-size:1vw;opacity:0.7;margin-top:0.5vw;text-align:right;">— ${escapeHtml(b.author)}</div>` : ''}
            </div>`;
        } else if (b.type === 'sticker') {
            body += `<div style="text-align:center;padding:1vw;font-size:12vw;line-height:1;">${escapeHtml(b.content||'🎉')}</div>`;
        } else if (b.type === 'codeblock') {
            body += `<div style="background:#0f172a;color:#e2e8f0;font-family:'D2Coding','Consolas',monospace;
                padding:1vw 1.5vw;margin:0.5vw 0;border-radius:0.4vw;font-size:1.2vw;
                white-space:pre-wrap;text-align:left;">
                <div style="font-size:0.7vw;color:#64748b;text-transform:uppercase;margin-bottom:0.4vw;">${escapeHtml(b.lang||'plain')}</div>${escapeHtml(b.content||'')}
            </div>`;
        } else if (b.type === 'location') {
            body += `<div style="background:rgba(255,255,255,0.95);color:#0f172a;border-radius:0.6vw;
                padding:1.5vw 2vw;margin:0.5vw;display:flex;gap:1.5vw;align-items:center;">
                <div style="font-size:4vw;color:#dc2626;">📍</div>
                <div style="flex:1;text-align:left;">
                    <div style="font-size:2vw;font-weight:800;">${escapeHtml(b.name||'장소')}</div>
                    <div style="font-size:1.2vw;color:#6b7280;margin-top:0.3vw;">${escapeHtml(b.address||'')}</div>
                </div>
            </div>`;
        } else if (b.type === 'schedule') {
            const d = b.date ? new Date(b.date) : new Date();
            const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
            const weeks = ['일','월','화','수','목','금','토'];
            body += `<div style="background:linear-gradient(135deg,#1e3a8a 0%,#7c3aed 100%);color:#fff;
                border-radius:0.6vw;padding:1.5vw 2vw;margin:0.5vw;display:flex;gap:1.5vw;align-items:center;">
                <div style="background:#fff;color:#1e3a8a;min-width:7vw;padding:1vw;border-radius:0.5vw;text-align:center;">
                    <div style="font-size:0.9vw;font-weight:700;color:#dc2626;">${months[d.getMonth()]}</div>
                    <div style="font-size:3.5vw;font-weight:900;line-height:1;">${d.getDate()}</div>
                    <div style="font-size:0.8vw;color:#6b7280;">${weeks[d.getDay()]}요일</div>
                </div>
                <div style="flex:1;text-align:left;">
                    <div style="font-size:2vw;font-weight:800;">${escapeHtml(b.title||'')}</div>
                    <div style="font-size:1.1vw;opacity:0.9;margin-top:0.4vw;">
                        ${b.time ? `🕐 ${escapeHtml(b.time)}` : ''}
                        ${b.place ? `&nbsp;&nbsp;📍 ${escapeHtml(b.place)}` : ''}
                    </div>
                </div>
            </div>`;
        } else if (b.type === 'formula') {
            // KaTeX 미사용 시 단순 텍스트 표시 (TV는 KaTeX 미로딩일 수 있음)
            body += `<div style="background:rgba(255,255,255,0.1);padding:1.5vw;margin:0.5vw;border-radius:0.4vw;color:#fff;font-size:2.5vw;text-align:center;font-family:monospace;">${escapeHtml(b.latex||'')}</div>`;
        }
    }

    let tickerHtml = '';
    for (const b of tickers) {
        const s = b.style || {};
        const pos = b.position === 'top' ? 'top:0' : 'bottom:0';
        tickerHtml += `<div style="position:absolute;left:0;right:0;${pos};overflow:hidden;white-space:nowrap;
            background:${s.bg||'#000000'};color:${s.color||'#fbbf24'};
            padding:0.5vw 1vw;font-weight:${s.bold!==false?800:400};font-size:${s.font_size||2}vw;">
            <span style="display:inline-block;animation:tickerScroll ${b.speed||25}s linear infinite;">${escapeHtml(b.content||'')}</span>
        </div>`;
    }

    stage.innerHTML = `<div style="position:fixed;inset:0;background:${bg};display:flex;flex-direction:column;padding:1vw 2vw;overflow:hidden;">
        ${body}
        ${tickerHtml}
    </div>
    <style>@keyframes tickerScroll {0%{transform:translateX(100%);}100%{transform:translateX(-100%);}}</style>`;
}

function renderSlide(item) {
    const m = item.meta;
    const bg = m.bg_color || '#0f172a';
    const elements = (m.elements || []).slice().sort((a,b) => (a.z||0) - (b.z||0));

    let html = `<div style="position:fixed;inset:0;background:${bg};overflow:hidden;">`;
    for (const e of elements) {
        const style = `position:absolute;left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${e.h}%;z-index:${e.z||0};box-sizing:border-box;overflow:hidden;`;
        if (e.type === 'text') {
            const fs = (e.font_size || 4);
            const justify = (e.text_align === 'left') ? 'flex-start'
                          : (e.text_align === 'right') ? 'flex-end' : 'center';
            const bgStyle = e.no_bg ? 'transparent' : (e.bg || 'transparent');
            html += `<div style="${style}color:${e.color||'#fff'};background:${bgStyle};
                font-size:${fs}vw;font-weight:${e.weight||700};
                display:flex;align-items:center;justify-content:${justify};
                text-align:${e.text_align||'center'};padding:0.4vw 0.8vw;
                line-height:1.2;word-break:keep-all;white-space:pre-line;">${escapeHtml(e.content||'')}</div>`;
        } else if (e.type === 'image') {
            const fit = e.fit || 'contain';
            html += `<div style="${style}"><img src="${escapeHtml(e.url)}" style="width:100%;height:100%;object-fit:${fit};display:block;"></div>`;
        } else if (e.type === 'video') {
            const fit = e.fit || 'contain';
            const ap = e.autoplay !== false ? 'autoplay' : '';
            const lp = e.loop !== false ? 'loop' : '';
            const mu = e.muted !== false ? 'muted' : '';
            html += `<div style="${style}"><video src="${escapeHtml(e.url)}" ${ap} ${lp} ${mu} playsinline style="width:100%;height:100%;object-fit:${fit};display:block;"></video></div>`;
        } else if (e.type === 'web') {
            html += `<div style="${style}"><iframe src="${escapeHtml(e.url)}" sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%;height:100%;border:0;"></iframe></div>`;
        } else if (e.type === 'shape') {
            const op = (e.opacity || 100) / 100;
            html += `<div style="${style}background:${e.bg_color||'#3b82f6'};border-radius:${e.radius||0}px;opacity:${op};"></div>`;
        }
    }
    html += '</div>';
    stage.innerHTML = html;
}

function renderBirthday(item) {
    const m = item.meta;
    const names = m.names || [];
    const n = Math.min(names.length, 10);
    const bg = m.bg_color || '#fbbf24';
    const fg = m.fg_color || '#0f172a';
    const accent = m.accent || '#dc2626';
    const showDept = m.show_dept !== false;

    // 제목에서 이모지 분리
    const title = item.title || '🎂 생일자';
    let em = '🎂', rest = title;
    const matches = title.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\s]+)?(.*)$/u);
    if (matches) {
        em = (matches[1] || '🎂').trim();
        rest = (matches[2] || '').trim() || '생일자';
    }

    let cards = '';
    for (const p of names.slice(0, 10)) {
        const dp = (showDept && p.dept) ? `<div class="dp">${escapeHtml(p.dept)}</div>` : '';
        cards += `<div class="bday-cd"><div class="ck">🎂</div><div class="nm">${escapeHtml(p.name)}</div>${dp}</div>`;
    }

    // 떠다니는 색종이 (랜덤 12개)
    let confetti = '';
    const cfEmojis = ['🎉','🎊','🎈','✨','🌟','🍰','🎂'];
    for (let i = 0; i < 14; i++) {
        const left = Math.random()*100;
        const delay = Math.random()*6;
        const dur = 5 + Math.random()*5;
        const e = cfEmojis[Math.floor(Math.random()*cfEmojis.length)];
        confetti += `<div class="confetti" style="left:${left}vw; animation-duration:${dur}s; animation-delay:${delay}s;">${e}</div>`;
    }

    stage.innerHTML = `<div class="c-birthday" style="--bg:${bg};--fg:${fg};--accent:${accent};">
        <div class="bday-h"><span class="em">${escapeHtml(em)}</span> ${escapeHtml(rest)}</div>
        <div class="bday-g" data-n="${n}">${cards}</div>
        ${confetti}
    </div>`;
}

function renderEmergency(em) {
    document.documentElement.style.setProperty('--em-bg', em.bg_color || '#dc2626');
    let imgHtml = em.image_path ? `<img src="/signage/uploads/${em.image_path}" alt="">` : '';
    stage.innerHTML = `<div class="c-emergency">
        <div class="em-icon">🚨</div>
        <div class="em-title">${em.title}</div>
        <div class="em-body">${(em.body || '').replace(/\n/g, '<br>')}</div>
        ${imgHtml}
    </div>`;
}

// ─── 멀티존 레이아웃 렌더링 ────────────────────────
function renderLayout(layout, items) {
    // 레이아웃이 단일 영역(full)이거나 영역이 없으면 일반 단일 재생으로 폴백
    if (!layout || !layout.zones || layout.zones.length <= 1) {
        return false;
    }
    // 영역별로 콘텐츠를 라운드로빈 할당 (zone_key 첫 글자/순서 기반)
    stage.innerHTML = '';
    stage.id = 'layoutStage';
    stage.style.background = '#000';
    layout.zones.forEach((z, i) => {
        const zd = document.createElement('div');
        zd.className = 'layout-zone';
        zd.style.left = z.x_pct + '%';
        zd.style.top = z.y_pct + '%';
        zd.style.width = z.w_pct + '%';
        zd.style.height = z.h_pct + '%';
        zd.style.zIndex = z.z_index || 0;
        // 해당 영역에 할당된 콘텐츠 (items 순환)
        const item = items[i % items.length];
        if (item) {
            zd.innerHTML = renderItemHtml(item);
        } else {
            zd.innerHTML = `<div class="c-empty" style="font-size:1.5vw;">${z.zone_key}</div>`;
        }
        stage.appendChild(zd);
    });
    return true;
}

function renderItemHtml(item) {
    if (item.meta && item.meta.subtype === 'slide' && Array.isArray(item.meta.elements)) {
        // 멀티존 안에서는 단순화: 첫 텍스트만 표시 또는 백그라운드만
        return `<div style="position:absolute;inset:0;background:${item.meta.bg_color||'#0f172a'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:2vw;">[슬라이드: ${escapeHtml(item.title||'')}]</div>`;
    }
    if (item.meta && item.meta.subtype === 'birthday' && Array.isArray(item.meta.names)) {
        const m = item.meta;
        const names = m.names.slice(0,10);
        const cards = names.map(p => {
            const dp = (m.show_dept !== false && p.dept) ? `<div class="dp">${escapeHtml(p.dept)}</div>` : '';
            return `<div class="bday-cd"><div class="ck">🎂</div><div class="nm">${escapeHtml(p.name)}</div>${dp}</div>`;
        }).join('');
        return `<div class="c-birthday" style="position:absolute;inset:0;--bg:${m.bg_color||'#fbbf24'};--fg:${m.fg_color||'#0f172a'};--accent:${m.accent||'#dc2626'};">
            <div class="bday-h"><span class="em">🎂</span> ${escapeHtml(item.title||'생일자')}</div>
            <div class="bday-g" data-n="${names.length}">${cards}</div>
        </div>`;
    }
    if (item.type === 'text') {
        const body = (item.body_text || item.title || '').replace(/\n/g, '<br>');
        return `<div class="c-text">${body}</div>`;
    } else if (item.type === 'image' && item.file_path) {
        return `<div class="c-image"><img src="/signage/uploads/${item.file_path}" alt=""></div>`;
    } else if (item.type === 'web' && item.web_url) {
        return `<iframe class="c-web" src="${item.web_url}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
    } else if (item.type === 'video' && item.file_path) {
        return `<div class="c-video"><video src="/signage/uploads/${item.file_path}" autoplay muted loop playsinline></video></div>`;
    } else if (item.type === 'pdf' && item.file_path) {
        return `<div class="c-pdf"><embed src="/signage/uploads/${item.file_path}#toolbar=0&navpanes=0&view=FitH" type="application/pdf"></div>`;
    }
    return `<div class="c-empty"><div class="icon">❓</div></div>`;
}

// ─── 재생 로직 ─────────────────────────────────────
function playNext() {
    clearTimeout(playTimer);

    // 이전 콘텐츠 로그 (시작~종료)
    if (logStartTime && currentItems[currentIdx]) {
        const dur = Math.round((Date.now() - logStartTime) / 1000);
        sendLog(currentItems[currentIdx].content_id, currentPlaylistId, dur);
    }

    if (currentEmergency) {
        renderEmergency(currentEmergency);
        // 긴급공지는 다음 폴링까지 유지
        return;
    }

    // 멀티존 레이아웃 활성 → 영역별 동시 송출
    if (currentLayout && currentLayout.zones && currentLayout.zones.length > 1 && currentItems.length) {
        if (renderLayout(currentLayout, currentItems)) {
            // 레이아웃 모드에서는 다음 항목 자동 진행 안 함 (각 영역이 자체 루프)
            logStartTime = Date.now();
            debug(`▶ 레이아웃 ${currentLayout.name} · ${currentLayout.zones.length}영역`);
            return;
        }
    }

    if (!currentItems.length) {
        renderContent(null);
        return;
    }

    // loop_mode 처리
    if (currentLoopMode === 'random') {
        currentIdx = Math.floor(Math.random() * currentItems.length);
    } else if (currentLoopMode === 'priority') {
        // priority 높은 순으로 정렬해서 가중치 선택
        const sorted = [...currentItems].sort((a,b) => (b.priority||0) - (a.priority||0));
        currentItems = sorted;
        currentIdx = currentIdx % currentItems.length;
    }
    // sequential 기본

    const item = currentItems[currentIdx];
    renderContent(item);
    logStartTime = Date.now();
    debug(`▶ ${item.title} (${item.type}, ${item.duration_sec}s) [${currentIdx+1}/${currentItems.length}]`);

    // 다음 콘텐츠 예약
    const durationMs = (item.duration_sec || 10) * 1000;
    playTimer = setTimeout(() => {
        currentIdx = (currentIdx + 1) % currentItems.length;
        playNext();
    }, durationMs);
}

// ─── 서버 통신 ─────────────────────────────────────
async function poll() {
    try {
        const res = await fetch(`/signage/api/play/${TOKEN}/poll`, {cache: 'no-cache'});
        if (!res.ok) {
            setStatus(false);
            debug(`poll err HTTP ${res.status}`);
            return;
        }
        const j = await res.json();
        setStatus(true);

        // 데이터 변경 여부 (해시)
        const hash = JSON.stringify([j.emergency_id, j.playlist_id, j.items?.length,
                                    j.items?.map(i=>i.content_id+'@'+i.duration_sec).join(',')]);

        // 레이아웃까지 해시에 포함
        const layoutHash = j.layout ? `L${j.layout.id}#${j.layout.zones?.length||0}` : 'L0';
        const fullHash = hash + '|' + layoutHash;

        if (fullHash !== lastPollHash) {
            lastPollHash = fullHash;
            debug(`poll: 변경 감지 (items=${j.items?.length||0}, emergency=${!!j.emergency}, layout=${j.layout?.name||'none'})`);

            currentItems = j.items || [];
            currentPlaylistId = j.playlist_id;
            currentLoopMode = j.loop_mode || 'sequential';
            currentLayout = j.layout || null;
            currentEmergency = j.emergency ? {
                title: j.title, body: j.body, image_path: j.image_path,
                bg_color: j.bg_color, id: j.emergency_id
            } : null;
            currentIdx = 0;
            playNext();
        }
    } catch (e) {
        setStatus(false);
        debug(`poll exception: ${e.message}`);
    }
}

async function sendLog(contentId, playlistId, duration) {
    try {
        await fetch(`/signage/api/play/${TOKEN}/log`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                content_id: contentId, playlist_id: playlistId, duration_sec: duration
            })
        });
    } catch (e) { /* 무시 */ }
}

async function heartbeat() {
    try {
        await fetch(`/signage/api/play/${TOKEN}/heartbeat`, {method: 'POST'});
        setStatus(true);
    } catch (e) {
        setStatus(false);
    }
}

// ─── 시작 ─────────────────────────────────────────
poll();                          // 즉시 1회
setInterval(poll, 15 * 1000);    // 15초 폴링
setInterval(heartbeat, 30 * 1000); // 30초 heartbeat

// 화면 켜둠 (no sleep): video 트릭 또는 그냥 두면 됨
// 새로고침 방지: visibilitychange 시 재시작
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
        debug('visible: re-poll');
        poll();
    }
});

// ESC 키로 종료 (개발 편의)
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (confirm('재생 종료?')) location.href = '/signage/play/pair';
    }
});
</script>
