<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘텐츠 에디터 — 디지털 사이니지</title>
    <link rel="icon" type="image/gif" href="/static/LOGO.GIF">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}?v=27" rel="stylesheet">
    <style>
        body { background:#f1f5f9; }

        /* 상단 액션바 */
        .action-bar {
            background:#fff; border-bottom:1px solid #e2e8f0;
            padding:8px 14px; display:flex; align-items:center; gap:10px;
            position:sticky; top:0; z-index:50;
        }
        .action-bar .title-input {
            font-size:1.05rem; font-weight:700; border:none; outline:none;
            min-width:300px; flex:1; max-width:500px;
        }
        .action-bar .ab-right { margin-left:auto; display:flex; gap:6px; align-items:center; }

        /* 메인 레이아웃 */
        .editor-wrap {
            display:grid; grid-template-columns: 1fr 1fr; gap:10px;
            padding:10px; min-height: calc(100vh - 110px);
        }

        /* 좌측: 편집 */
        .edit-pane {
            background:#fff; border:1px solid #e2e8f0; border-radius:2px;
            padding: 14px; overflow-y:auto;
            max-height: calc(100vh - 110px);
        }

        /* 우측: 미리보기 */
        .preview-pane {
            background:#fff; border:1px solid #e2e8f0; border-radius:2px;
            padding: 14px; position:sticky; top:60px;
            height: calc(100vh - 110px); overflow:auto;
            display:flex; flex-direction:column;
        }
        .preview-canvas {
            background:#0f172a; aspect-ratio:16/9; flex-shrink:0;
            overflow:hidden; position:relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display:flex; flex-direction:column;
        }
        .preview-meta {
            padding:8px 0; font-size:0.78rem; color:#64748b;
            display:flex; gap:10px; flex-wrap:wrap;
        }

        /* 블록 추가 툴바 */
        .add-toolbar {
            display:grid; grid-template-columns: repeat(5, 1fr); gap:4px;
            background:#f8fafc; border:1px solid #e2e8f0; border-radius:2px;
            padding:6px; margin-bottom:14px;
        }
        .add-btn {
            background:#fff; border:1px solid #e2e8f0; border-radius:2px;
            padding:8px 4px; font-size:0.72rem; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; gap:2px;
            transition:.15s;
        }
        .add-btn:hover { background:#1e40af; color:#fff; border-color:#1e3a8a; }
        .add-btn .ic { font-size:1.2rem; line-height:1; }

        /* 블록 카드 */
        .block-card {
            background:#fff; border:1px solid #e2e8f0; border-radius:3px;
            margin-bottom:8px; position:relative;
            transition:.1s;
        }
        .block-card:hover { border-color:#94a3b8; }
        .block-card.selected { border-color:#1e40af; box-shadow:0 0 0 2px rgba(30,64,175,0.18); }

        .block-head {
            display:flex; align-items:center; gap:6px; padding:6px 10px;
            background:#f8fafc; border-bottom:1px solid #e2e8f0;
            font-size:0.78rem; cursor:move;
        }
        .block-head .bh-ic { width:18px; text-align:center; }
        .block-head .bh-name { font-weight:700; color:#475569; }
        .block-head .bh-right { margin-left:auto; display:flex; gap:4px; }
        .block-head .bh-btn {
            background:transparent; border:none; cursor:pointer;
            color:#64748b; padding:2px 6px; font-size:0.85rem;
            border-radius:2px;
        }
        .block-head .bh-btn:hover { background:#e2e8f0; color:#0f172a; }
        .block-head .bh-btn.danger:hover { background:#fee2e2; color:#dc2626; }

        .block-body { padding: 10px 12px; }
        .block-body textarea,
        .block-body input[type=text],
        .block-body input[type=url],
        .block-body input[type=number] {
            width:100%; border:1px solid #e2e8f0; border-radius:2px;
            padding:6px 8px; font-size:0.88rem; outline:none;
        }
        .block-body textarea:focus,
        .block-body input:focus { border-color:#1e40af; }

        /* 인라인 스타일 툴바 */
        .style-bar {
            display:flex; flex-wrap:wrap; gap:4px; padding:6px 10px;
            background:#fafbfc; border-top:1px solid #f1f5f9;
            font-size:0.76rem; align-items:center;
        }
        .style-bar .sb-group { display:flex; gap:2px; align-items:center; }
        .style-bar .sb-group + .sb-group { margin-left:6px; padding-left:6px; border-left:1px solid #e2e8f0; }
        .style-bar label { color:#475569; margin:0; }
        .style-bar input[type=number],
        .style-bar select {
            font-size:0.76rem; padding:2px 4px; border:1px solid #cbd5e1;
            border-radius:2px; width:auto;
        }
        .style-bar input[type=number] { width:54px; }
        .style-bar input[type=color] {
            width:26px; height:22px; padding:1px;
            border:1px solid #cbd5e1; border-radius:2px;
        }
        .sb-toggle {
            background:transparent; border:1px solid #cbd5e1; border-radius:2px;
            padding:2px 6px; cursor:pointer; font-weight:700;
        }
        .sb-toggle.on { background:#1e40af; color:#fff; border-color:#1e3a8a; }

        /* 표 에디터 */
        .table-edit { border-collapse:collapse; width:100%; font-size:0.85rem; }
        .table-edit td {
            border:1px solid #cbd5e1; padding:4px;
            position:relative; min-width:60px;
        }
        .table-edit td input {
            border:none; outline:none; width:100%;
            padding:2px 4px; font-size:0.85rem; background:transparent;
        }
        .table-edit td.merged-source { background:#dbeafe; }
        .table-controls {
            display:flex; gap:4px; flex-wrap:wrap; margin-top:8px;
            font-size:0.78rem;
        }

        /* 빈 상태 */
        .empty-state {
            text-align:center; padding:40px 20px; color:#94a3b8;
            border:2px dashed #cbd5e1; border-radius:4px;
        }

        /* 모바일 탭 */
        .mobile-tabs { display:none; }
        @media (max-width: 991px) {
            .editor-wrap { grid-template-columns: 1fr; }
            .preview-pane { position:relative; top:auto; height:auto; }
            .mobile-tabs {
                display:flex; gap:0; background:#fff; border-bottom:1px solid #e2e8f0;
                position:sticky; top:50px; z-index:40;
            }
            .mobile-tabs button {
                flex:1; padding:10px; border:none; background:transparent;
                font-weight:700; font-size:0.9rem; cursor:pointer;
                border-bottom:2px solid transparent;
            }
            .mobile-tabs button.active {
                border-bottom-color:#1e40af; color:#1e40af;
            }
            .edit-pane.hide-m, .preview-pane.hide-m { display:none; }
        }

        /* ─── 미리보기 렌더링 (캔버스 내부) ─── */
        .pv-block {
            box-sizing:border-box; display:flex;
            word-break:keep-all; overflow:hidden;
        }
        .pv-block.b-text, .pv-block.b-heading {
            align-items:center;
        }
        .pv-block.b-image, .pv-block.b-video, .pv-block.b-pdf, .pv-block.b-web {
            justify-content:center; align-items:center;
        }
        .pv-block img, .pv-block video, .pv-block iframe, .pv-block embed {
            max-width:100%; max-height:100%;
            width:auto; height:auto; object-fit:contain;
        }
        .pv-block.fit-cover img, .pv-block.fit-cover video {
            width:100%; height:100%; object-fit:cover;
        }
        .pv-divider {
            border-bottom: 2px solid currentColor; opacity:0.4;
            margin: 0.5vw 0;
        }
        .pv-table {
            border-collapse: collapse; width:100%; height:100%;
        }
        .pv-table td {
            border:1px solid rgba(255,255,255,0.3);
            padding: 0.4vw 0.8vw;
        }
        .pv-ticker {
            position:absolute; left:0; right:0;
            background: rgba(0,0,0,0.75); color:#fbbf24;
            font-weight:700; padding: 0.5vw 1vw;
            overflow:hidden; white-space:nowrap;
        }
        .pv-ticker.top { top:0; } .pv-ticker.bottom { bottom:0; }
        .pv-ticker span {
            display:inline-block;
            animation: tickerScroll linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .pv-web-card {
            background: rgba(255,255,255,0.95); color:#0f172a;
            border-radius:0.6vw; padding:1.5vw; max-width:80%;
            display:flex; flex-direction:column; gap:0.5vw;
        }
        .pv-web-card .wc-title { font-weight:800; font-size:2vw; }
        .pv-web-card .wc-desc { font-size:1.2vw; opacity:0.7; }
        .pv-web-card .wc-url { font-size:0.9vw; color:#1e40af; }

        /* 전체화면 모달 */
        .fs-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.92);
            z-index:9999; display:none; align-items:center; justify-content:center;
            padding: 4vh 4vw;
        }
        .fs-overlay.show { display:flex; }
        .fs-canvas {
            background:#0f172a; width:100%; max-width:1920px;
            aspect-ratio: 16/9; box-shadow: 0 0 40px rgba(0,0,0,0.6);
            position:relative; overflow:hidden;
            display:flex; flex-direction:column;
        }
        .fs-close {
            position:fixed; top:10px; right:10px;
            background:#fff; color:#0f172a; border:none;
            font-size:1.2rem; padding:6px 12px; cursor:pointer;
            border-radius:4px;
        }
    </style>
</head>
<body>
{% set active_page = 'signage_contents' %}
{% include '_sidebar.html' %}

<form method="post" id="editorForm">
    <!-- 상단 액션바 -->
    <div class="action-bar">
        <input type="text" name="title" id="t_title" class="title-input"
               placeholder="콘텐츠 제목"
               value="{{ content.title if content else '' }}" oninput="markDirty()">
        <span class="text-muted small">|</span>
        <label class="small text-muted mb-0">⏱</label>
        <input type="number" name="duration_sec" class="form-control form-control-sm" style="width:70px;"
               value="{{ content.duration_sec if content else 15 }}" min="3" max="600" title="표시 시간(초)">
        <label class="small text-muted mb-0">★</label>
        <input type="number" name="priority" class="form-control form-control-sm" style="width:60px;"
               value="{{ content.priority if content else 0 }}" title="우선순위">
        <select name="status" id="t_status" class="form-select form-select-sm" style="width:90px;">
            <option value="active" {{ 'selected' if not content or content.status=='active' }}>사용</option>
            <option value="draft" {{ 'selected' if content and content.status=='draft' }}>임시</option>
            <option value="paused" {{ 'selected' if content and content.status=='paused' }}>중지</option>
        </select>
        <label class="small text-muted mb-0">배경</label>
        <input type="color" name="bg_color" id="t_bg"
               value="{{ content.bg_color if content else '#0f172a' }}"
               style="height:30px; width:36px; padding:0; border:1px solid #cbd5e1;"
               oninput="renderPreview()">

        <div class="ab-right">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="openFullscreen()">⛶ 전체 미리보기</button>
            <button type="button" class="btn btn-sm btn-outline-info" onclick="saveAs('draft')">💾 임시저장</button>
            <button type="submit" class="btn btn-sm btn-primary">💾 저장</button>
            <a href="/signage/contents" class="btn btn-sm btn-outline-secondary">취소</a>
        </div>
    </div>

    <!-- 모바일 탭 -->
    <div class="mobile-tabs">
        <button type="button" id="tabEdit" class="active" onclick="switchTab('edit')">✏️ 편집</button>
        <button type="button" id="tabPreview" onclick="switchTab('preview')">👁 미리보기</button>
    </div>

    <input type="hidden" name="blocks_json" id="blocksJson">
    <input type="hidden" name="bg_color" id="bgColorHidden">

    <div class="editor-wrap">
        <!-- 좌측: 편집 -->
        <div class="edit-pane" id="editPane">
            <h6 style="font-size:0.75rem; color:#64748b; text-transform:uppercase; margin-bottom:6px;">블록 추가</h6>
            <div class="add-toolbar">
                <button type="button" class="add-btn" onclick="addBlock('heading')"><span class="ic">🔠</span>큰 제목</button>
                <button type="button" class="add-btn" onclick="addBlock('text')"><span class="ic">📝</span>텍스트</button>
                <button type="button" class="add-btn" onclick="addBlock('image')"><span class="ic">🖼</span>이미지</button>
                <button type="button" class="add-btn" onclick="addBlock('video')"><span class="ic">🎬</span>동영상</button>
                <button type="button" class="add-btn" onclick="addBlock('pdf')"><span class="ic">📄</span>PDF</button>
                <button type="button" class="add-btn" onclick="addBlock('web')"><span class="ic">🌐</span>웹 링크</button>
                <button type="button" class="add-btn" onclick="addBlock('table')"><span class="ic">📊</span>표</button>
                <button type="button" class="add-btn" onclick="addBlock('divider')"><span class="ic">➖</span>구분선</button>
                <button type="button" class="add-btn" onclick="addBlock('ticker')"><span class="ic">📢</span>자막</button>
            </div>

            <h6 style="font-size:0.75rem; color:#64748b; text-transform:uppercase; margin: 10px 0 6px;">블록 목록</h6>
            <div id="blockList"></div>
        </div>

        <!-- 우측: 미리보기 -->
        <div class="preview-pane" id="previewPane">
            <h6 style="font-size:0.75rem; color:#64748b; text-transform:uppercase; margin-bottom:6px;">
                실시간 미리보기 (16:9 · 4K 송출 기준)
            </h6>
            <div class="preview-canvas" id="previewCanvas"></div>
            <div class="preview-meta">
                <span>📐 16:9 비율</span>
                <span>🖥 4K (3840×2160) 시뮬레이션</span>
                <span id="pvBlockCount">0개 블록</span>
            </div>
        </div>
    </div>
</form>

<!-- 전체화면 미리보기 -->
<div class="fs-overlay" id="fsOverlay">
    <button class="fs-close" onclick="closeFullscreen()">✕ 닫기 (ESC)</button>
    <div class="fs-canvas" id="fsCanvas"></div>
</div>

<input type="file" id="hiddenFile" style="display:none;">

<script>
// ──────────────────────────────────────────────────
//  상태
// ──────────────────────────────────────────────────
let blocks = {{ content.blocks|tojson if content else '[]' }};
let selectedIdx = -1;
let dragSrc = null;
let activeUploadIdx = null;
let activeUploadKind = null;

function uid() { return 'b' + Date.now() + Math.floor(Math.random()*1000); }
function markDirty() { /* 자동저장 hook 위치 */ }
function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ──────────────────────────────────────────────────
//  기본값 정의
// ──────────────────────────────────────────────────
const DEFAULTS = {
    heading: () => ({ id: uid(), type:'heading', content:'큰 제목', style:{ font_size:7, bold:true, align:'center', color:'#ffffff', bg:'transparent', padding:1.5 } }),
    text:    () => ({ id: uid(), type:'text', content:'본문 텍스트를 입력하세요.', style:{ font_size:3, align:'center', color:'#ffffff', bg:'transparent', padding:1 } }),
    image:   () => ({ id: uid(), type:'image', url:'', fit:'contain', style:{ padding:0, bg:'transparent' } }),
    video:   () => ({ id: uid(), type:'video', url:'', fit:'contain', autoplay:true, loop:true, muted:true, style:{ padding:0, bg:'transparent' } }),
    pdf:     () => ({ id: uid(), type:'pdf', url:'', style:{ padding:0, bg:'#ffffff' } }),
    web:     () => ({ id: uid(), type:'web', url:'', mode:'iframe', card_title:'', card_desc:'', style:{ padding:0, bg:'#f1f5f9' } }),
    table:   () => ({ id: uid(), type:'table',
        cells: [
            [{text:'항목',bold:true,align:'center'},{text:'값',bold:true,align:'center'}],
            [{text:''},{text:''}], [{text:''},{text:''}]
        ],
        style:{ font_size:2.5, color:'#ffffff', bg:'transparent', padding:1, align:'center' } }),
    divider: () => ({ id: uid(), type:'divider', style:{ color:'#94a3b8', padding:0.5 } }),
    ticker:  () => ({ id: uid(), type:'ticker', content:'자막 또는 하단 안내문', position:'bottom', speed:25,
                      style:{ font_size:2, bold:true, color:'#fbbf24', bg:'#000000' } }),
};

// ──────────────────────────────────────────────────
//  블록 조작
// ──────────────────────────────────────────────────
function addBlock(type) {
    const b = DEFAULTS[type]();
    blocks.push(b);
    selectedIdx = blocks.length - 1;
    renderAll();
    // 새로 추가한 블록으로 스크롤
    setTimeout(() => {
        const el = document.querySelector(`[data-idx="${selectedIdx}"]`);
        if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 50);
}
function deleteBlock(idx) {
    if (!confirm('이 블록을 삭제할까요?')) return;
    blocks.splice(idx, 1);
    if (selectedIdx === idx) selectedIdx = -1;
    else if (selectedIdx > idx) selectedIdx--;
    renderAll();
}
function moveBlock(idx, dir) {
    const ni = idx + dir;
    if (ni < 0 || ni >= blocks.length) return;
    [blocks[idx], blocks[ni]] = [blocks[ni], blocks[idx]];
    selectedIdx = ni;
    renderAll();
}
function duplicateBlock(idx) {
    const b = JSON.parse(JSON.stringify(blocks[idx]));
    b.id = uid();
    blocks.splice(idx+1, 0, b);
    selectedIdx = idx+1;
    renderAll();
}
function update(idx, patch) {
    Object.assign(blocks[idx], patch);
    renderPreview();
    // 스타일 변경 후 좌측 미리보기 일부만 갱신을 위해 부분 리렌더
}
function updateStyle(idx, patch) {
    blocks[idx].style = Object.assign({}, blocks[idx].style||{}, patch);
    renderAll();
}

// ──────────────────────────────────────────────────
//  편집 패널 렌더링
// ──────────────────────────────────────────────────
function renderAll() {
    renderEditor();
    renderPreview();
}

function renderEditor() {
    const list = document.getElementById('blockList');
    list.innerHTML = '';
    if (!blocks.length) {
        list.innerHTML = `<div class="empty-state">
            <div style="font-size:2rem;">📝</div>
            <div class="mt-2">상단에서 블록을 추가하세요</div>
        </div>`;
        return;
    }
    blocks.forEach((b, i) => {
        const card = document.createElement('div');
        card.className = 'block-card' + (selectedIdx === i ? ' selected' : '');
        card.dataset.idx = i;
        card.draggable = true;
        card.ondragstart = (e) => { dragSrc = i; e.dataTransfer.effectAllowed='move'; };
        card.ondragover = (e) => { e.preventDefault(); };
        card.ondrop = (e) => {
            e.preventDefault();
            if (dragSrc === null || dragSrc === i) return;
            const [moved] = blocks.splice(dragSrc, 1);
            blocks.splice(i, 0, moved);
            dragSrc = null;
            selectedIdx = i;
            renderAll();
        };
        card.onclick = (e) => {
            if (e.target.closest('.bh-btn,.style-bar,input,textarea,select,button')) return;
            selectedIdx = i; renderAll();
        };

        const icons = {heading:'🔠', text:'📝', image:'🖼', video:'🎬', pdf:'📄', web:'🌐', table:'📊', divider:'➖', ticker:'📢'};
        const names = {heading:'큰 제목', text:'텍스트', image:'이미지', video:'동영상', pdf:'PDF', web:'웹 링크', table:'표', divider:'구분선', ticker:'자막'};

        card.innerHTML = `
            <div class="block-head">
                <span class="bh-ic">${icons[b.type]||'?'}</span>
                <span class="bh-name">${names[b.type]||b.type}</span>
                <span class="text-muted small">· #${i+1}</span>
                <div class="bh-right">
                    <button type="button" class="bh-btn" onclick="moveBlock(${i},-1)" title="위로">▲</button>
                    <button type="button" class="bh-btn" onclick="moveBlock(${i},+1)" title="아래로">▼</button>
                    <button type="button" class="bh-btn" onclick="duplicateBlock(${i})" title="복제">⎘</button>
                    <button type="button" class="bh-btn danger" onclick="deleteBlock(${i})" title="삭제">✕</button>
                </div>
            </div>
            <div class="block-body">${renderBlockBody(b, i)}</div>
            ${renderStyleBar(b, i)}
        `;
        list.appendChild(card);
    });
}

function renderBlockBody(b, i) {
    if (b.type === 'heading' || b.type === 'text' || b.type === 'ticker') {
        return `<textarea oninput="blocks[${i}].content=this.value; renderPreview();"
                          rows="${b.type==='text'?3:2}"
                          placeholder="${b.type==='ticker'?'자막 텍스트':'내용을 입력하세요'}">${escapeHtml(b.content||'')}</textarea>`;
    }
    if (b.type === 'image' || b.type === 'video' || b.type === 'pdf') {
        const accept = b.type === 'image' ? 'image/*' : b.type === 'video' ? 'video/*' : 'application/pdf,.pdf';
        const preview = b.url
            ? (b.type==='image' ? `<img src="${escapeHtml(b.url)}" style="max-height:140px; max-width:100%; margin-top:6px; border:1px solid #e2e8f0;">`
               : b.type==='video' ? `<video src="${escapeHtml(b.url)}" controls muted style="max-height:140px; max-width:100%; margin-top:6px;"></video>`
               : `<embed src="${escapeHtml(b.url)}" type="application/pdf" style="width:100%; height:120px; margin-top:6px;">`)
            : '';
        return `
            <div class="d-flex gap-2 align-items-center">
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="openUpload(${i}, '${b.type}', '${accept}')">📁 파일 선택</button>
                <input type="text" placeholder="또는 URL 직접 입력 (https://...)"
                       value="${escapeHtml(b.url||'')}"
                       oninput="blocks[${i}].url=this.value; renderEditor(); renderPreview();">
            </div>
            ${preview}
        `;
    }
    if (b.type === 'web') {
        return `
            <div class="mb-2">
                <input type="url" placeholder="https://example.com" value="${escapeHtml(b.url||'')}"
                       oninput="blocks[${i}].url=this.value; renderPreview();">
            </div>
            <div class="d-flex gap-2 align-items-center small">
                <label><input type="radio" name="webMode${i}" value="iframe" ${b.mode!=='card'?'checked':''}
                       onchange="blocks[${i}].mode='iframe'; renderPreview();"> iframe 임베드</label>
                <label><input type="radio" name="webMode${i}" value="card" ${b.mode==='card'?'checked':''}
                       onchange="blocks[${i}].mode='card'; renderEditor(); renderPreview();"> 미리보기 카드</label>
            </div>
            ${b.mode==='card' ? `
                <div class="mt-2">
                    <input type="text" placeholder="카드 제목" value="${escapeHtml(b.card_title||'')}"
                           oninput="blocks[${i}].card_title=this.value; renderPreview();" style="margin-bottom:4px;">
                    <input type="text" placeholder="카드 설명" value="${escapeHtml(b.card_desc||'')}"
                           oninput="blocks[${i}].card_desc=this.value; renderPreview();">
                </div>` : ''}
        `;
    }
    if (b.type === 'table') {
        return renderTableEditor(b, i);
    }
    if (b.type === 'divider') {
        return `<div class="text-muted small">화면 가로 구분선이 추가됩니다.</div>`;
    }
    return '';
}

function renderTableEditor(b, i) {
    const cells = b.cells || [[{text:''}]];
    const rows = cells.length;
    const cols = Math.max(...cells.map(r => r.length));
    let h = '<table class="table-edit"><tbody>';
    for (let r = 0; r < rows; r++) {
        h += '<tr>';
        for (let c = 0; c < cols; c++) {
            const cell = cells[r][c] || {text:''};
            // skip cells covered by merge
            if (cell._covered) { continue; }
            const cs = cell.colspan || 1;
            const rs = cell.rowspan || 1;
            const bold = cell.bold ? 'font-weight:700;' : '';
            const align = cell.align ? `text-align:${cell.align};` : '';
            h += `<td colspan="${cs}" rowspan="${rs}" style="${bold}${align}">
                <input type="text" value="${escapeHtml(cell.text||'')}"
                       oninput="tableCell(${i},${r},${c},'text',this.value)"
                       onfocus="selectCell(${i},${r},${c})">
            </td>`;
        }
        h += '</tr>';
    }
    h += '</tbody></table>';
    h += `<div class="table-controls">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addTableRow(${i})">＋ 행</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addTableCol(${i})">＋ 열</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="delTableRow(${i})">－ 행</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="delTableCol(${i})">－ 열</button>
        <span class="text-muted ms-2">셀 선택 후:</span>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="mergeRight(${i})">→ 우측 병합</button>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="mergeDown(${i})">↓ 하단 병합</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="unmerge(${i})">병합해제</button>
        <button type="button" class="btn btn-sm btn-outline-warning" onclick="toggleCellBold(${i})">B</button>
        <select class="form-select form-select-sm" style="width:90px;" onchange="setCellAlign(${i}, this.value)">
            <option value="left">왼쪽</option><option value="center" selected>가운데</option><option value="right">오른쪽</option>
        </select>
    </div>`;
    return h;
}

let selectedCell = null;
function selectCell(blockIdx, r, c) {
    selectedCell = {blockIdx, r, c};
}
function tableCell(idx, r, c, key, value) {
    if (!blocks[idx].cells[r][c]) blocks[idx].cells[r][c] = {};
    blocks[idx].cells[r][c][key] = value;
    renderPreview();
}
function addTableRow(idx) {
    const cols = Math.max(...blocks[idx].cells.map(r => r.length));
    blocks[idx].cells.push(Array(cols).fill(null).map(()=>({text:''})));
    renderAll();
}
function addTableCol(idx) {
    for (const row of blocks[idx].cells) row.push({text:''});
    renderAll();
}
function delTableRow(idx) {
    if (blocks[idx].cells.length > 1) blocks[idx].cells.pop();
    renderAll();
}
function delTableCol(idx) {
    for (const row of blocks[idx].cells) if (row.length > 1) row.pop();
    renderAll();
}
function mergeRight(idx) {
    if (!selectedCell || selectedCell.blockIdx !== idx) return alert('병합할 셀을 먼저 클릭하세요.');
    const {r, c} = selectedCell;
    const cell = blocks[idx].cells[r][c];
    if (!cell) return;
    const nextC = c + (cell.colspan || 1);
    if (nextC >= blocks[idx].cells[r].length) return;
    cell.colspan = (cell.colspan || 1) + 1;
    if (blocks[idx].cells[r][nextC]) blocks[idx].cells[r][nextC]._covered = true;
    renderAll();
}
function mergeDown(idx) {
    if (!selectedCell || selectedCell.blockIdx !== idx) return alert('병합할 셀을 먼저 클릭하세요.');
    const {r, c} = selectedCell;
    const cell = blocks[idx].cells[r][c];
    if (!cell) return;
    const nextR = r + (cell.rowspan || 1);
    if (nextR >= blocks[idx].cells.length) return;
    cell.rowspan = (cell.rowspan || 1) + 1;
    if (blocks[idx].cells[nextR][c]) blocks[idx].cells[nextR][c]._covered = true;
    renderAll();
}
function unmerge(idx) {
    if (!selectedCell || selectedCell.blockIdx !== idx) return;
    const {r, c} = selectedCell;
    blocks[idx].cells[r][c].colspan = 1;
    blocks[idx].cells[r][c].rowspan = 1;
    // _covered 모두 해제
    for (const row of blocks[idx].cells) for (const cell of row) delete cell._covered;
    renderAll();
}
function toggleCellBold(idx) {
    if (!selectedCell || selectedCell.blockIdx !== idx) return;
    const {r, c} = selectedCell;
    blocks[idx].cells[r][c].bold = !blocks[idx].cells[r][c].bold;
    renderAll();
}
function setCellAlign(idx, val) {
    if (!selectedCell || selectedCell.blockIdx !== idx) return;
    const {r, c} = selectedCell;
    blocks[idx].cells[r][c].align = val;
    renderAll();
}

// 스타일 인라인 바
function renderStyleBar(b, i) {
    const s = b.style || {};
    const isText = (b.type === 'heading' || b.type === 'text' || b.type === 'ticker' || b.type === 'table');
    let h = '<div class="style-bar">';
    if (isText) {
        h += `<div class="sb-group">
            <label>크기</label>
            <input type="number" value="${s.font_size||3}" step="0.5" min="0.8" max="20"
                   oninput="updateStyle(${i},{font_size:parseFloat(this.value)||3})">
            <span class="text-muted">vw</span>
        </div>`;
        h += `<div class="sb-group">
            <button type="button" class="sb-toggle ${s.bold?'on':''}" onclick="updateStyle(${i},{bold:!${!!s.bold}})">B</button>
            <button type="button" class="sb-toggle ${s.italic?'on':''}" style="font-style:italic;" onclick="updateStyle(${i},{italic:!${!!s.italic}})">I</button>
        </div>`;
        h += `<div class="sb-group">
            <label>정렬</label>
            <select onchange="updateStyle(${i},{align:this.value})">
                <option value="left"${s.align==='left'?' selected':''}>왼쪽</option>
                <option value="center"${(!s.align||s.align==='center')?' selected':''}>가운데</option>
                <option value="right"${s.align==='right'?' selected':''}>오른쪽</option>
            </select>
        </div>`;
        h += `<div class="sb-group">
            <label>글자</label>
            <input type="color" value="${s.color||'#ffffff'}" oninput="updateStyle(${i},{color:this.value})">
            <label>배경</label>
            <input type="color" value="${(s.bg && s.bg !== 'transparent')?s.bg:'#000000'}" oninput="updateStyle(${i},{bg:this.value})">
            <button type="button" class="sb-toggle ${(s.bg==='transparent'||!s.bg)?'on':''}" onclick="updateStyle(${i},{bg:'transparent'})">투명</button>
        </div>`;
    }
    if (b.type === 'image' || b.type === 'video') {
        h += `<div class="sb-group">
            <label>맞춤</label>
            <select onchange="update(${i},{fit:this.value}); renderEditor();">
                <option value="contain" ${b.fit!=='cover'?'selected':''}>비율 유지</option>
                <option value="cover" ${b.fit==='cover'?'selected':''}>화면 채움</option>
            </select>
        </div>`;
    }
    if (b.type === 'ticker') {
        h += `<div class="sb-group">
            <label>위치</label>
            <select onchange="update(${i},{position:this.value})">
                <option value="bottom" ${b.position!=='top'?'selected':''}>하단</option>
                <option value="top" ${b.position==='top'?'selected':''}>상단</option>
            </select>
            <label>속도</label>
            <input type="number" value="${b.speed||25}" min="5" max="120"
                   oninput="update(${i},{speed:parseInt(this.value)||25})">
        </div>`;
    }
    h += `<div class="sb-group">
        <label>여백</label>
        <input type="number" value="${s.padding||0}" step="0.5" min="0" max="20"
               oninput="updateStyle(${i},{padding:parseFloat(this.value)||0})">
        <span class="text-muted">vw</span>
    </div>`;
    // 블록별 지속시간(옵션)
    h += `<div class="sb-group">
        <label>표시(초)</label>
        <input type="number" value="${b.duration_sec||''}" min="0" max="60" placeholder="자동"
               oninput="update(${i},{duration_sec: this.value ? parseInt(this.value) : null})">
    </div>`;
    h += '</div>';
    return h;
}

// ──────────────────────────────────────────────────
//  파일 업로드
// ──────────────────────────────────────────────────
function openUpload(idx, kind, accept) {
    activeUploadIdx = idx;
    activeUploadKind = kind;
    const f = document.getElementById('hiddenFile');
    f.accept = accept;
    f.onchange = uploadFile;
    f.click();
}
async function uploadFile(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
        const res = await fetch('/signage/api/slide/upload', {method:'POST', body: fd});
        const j = await res.json();
        if (!j.ok) { alert('업로드 실패: '+j.msg); return; }
        blocks[activeUploadIdx].url = j.url;
        renderAll();
    } catch (e) {
        alert('네트워크 오류: '+e.message);
    } finally {
        ev.target.value = '';
    }
}

// ──────────────────────────────────────────────────
//  미리보기 렌더링 (canvas 내부)
// ──────────────────────────────────────────────────
function renderPreview() {
    const canvas = document.getElementById('previewCanvas');
    const bg = document.getElementById('t_bg').value;
    canvas.style.background = bg;
    canvas.innerHTML = '';
    // 카운트
    document.getElementById('pvBlockCount').textContent = `${blocks.length}개 블록`;
    // 본문 영역과 ticker(절대 배치) 분리
    const main = document.createElement('div');
    main.style.cssText = 'flex:1; display:flex; flex-direction:column; padding: 1vw 2vw; gap:0.5vw; overflow:hidden;';
    canvas.appendChild(main);

    for (const b of blocks) {
        if (b.type === 'ticker') continue;  // 별도 처리
        const el = renderPreviewBlock(b);
        if (el) main.appendChild(el);
    }
    // ticker
    for (const b of blocks) {
        if (b.type !== 'ticker') continue;
        const el = renderPreviewBlock(b);
        if (el) canvas.appendChild(el);
    }
    // fs도 함께
    const fs = document.getElementById('fsCanvas');
    if (fs.classList.contains('show')) fillFs();
}

function renderPreviewBlock(b) {
    const s = b.style || {};
    const div = document.createElement('div');
    div.className = 'pv-block b-' + b.type + (b.fit === 'cover' ? ' fit-cover' : '');
    const css = [];
    if (s.font_size) css.push(`font-size:${s.font_size}vw`);
    if (s.bold) css.push('font-weight:800');
    if (s.italic) css.push('font-style:italic');
    if (s.align) css.push(`text-align:${s.align}`);
    if (s.color) css.push(`color:${s.color}`);
    if (s.bg && s.bg !== 'transparent') css.push(`background:${s.bg}`);
    if (s.padding) css.push(`padding:${s.padding}vw`);
    // 정렬 → justify-content
    if (s.align === 'left') css.push('justify-content:flex-start');
    else if (s.align === 'right') css.push('justify-content:flex-end');
    else css.push('justify-content:center');
    div.style.cssText = css.join(';');

    if (b.type === 'heading' || b.type === 'text') {
        div.innerHTML = escapeHtml(b.content || '').replace(/\n/g,'<br>');
    } else if (b.type === 'image') {
        if (!b.url) {
            div.innerHTML = '<div style="opacity:0.4; font-size:1.5vw;">🖼 이미지 없음</div>';
            div.style.minHeight = '10vw';
        } else {
            div.innerHTML = `<img src="${escapeHtml(b.url)}" alt="">`;
            div.style.minHeight = '10vw';
            div.style.flex = '1';
        }
    } else if (b.type === 'video') {
        if (!b.url) {
            div.innerHTML = '<div style="opacity:0.4; font-size:1.5vw;">🎬 영상 없음</div>';
            div.style.minHeight = '10vw';
        } else {
            const ap = b.autoplay !== false ? 'autoplay' : '';
            const lp = b.loop !== false ? 'loop' : '';
            const mu = b.muted !== false ? 'muted' : '';
            div.innerHTML = `<video src="${escapeHtml(b.url)}" ${ap} ${lp} ${mu} playsinline></video>`;
            div.style.minHeight = '10vw';
            div.style.flex = '1';
        }
    } else if (b.type === 'pdf') {
        if (!b.url) {
            div.innerHTML = '<div style="opacity:0.4; font-size:1.5vw;">📄 PDF 없음</div>';
            div.style.minHeight = '10vw';
        } else {
            div.innerHTML = `<embed src="${escapeHtml(b.url)}#toolbar=0&navpanes=0" type="application/pdf" style="width:100%; height:100%;">`;
            div.style.minHeight = '15vw'; div.style.flex = '1';
        }
    } else if (b.type === 'web') {
        if (!b.url) {
            div.innerHTML = '<div style="opacity:0.4; font-size:1.5vw;">🌐 URL 없음</div>';
            div.style.minHeight = '10vw';
        } else if (b.mode === 'card') {
            const hostMatch = b.url.match(/^https?:\/\/([^/]+)/);
            const host = hostMatch ? hostMatch[1] : b.url;
            div.innerHTML = `<div class="pv-web-card">
                <div class="wc-title">${escapeHtml(b.card_title || host)}</div>
                ${b.card_desc ? `<div class="wc-desc">${escapeHtml(b.card_desc)}</div>` : ''}
                <div class="wc-url">🔗 ${escapeHtml(b.url)}</div>
            </div>`;
            div.style.minHeight = '8vw';
        } else {
            div.innerHTML = `<iframe src="${escapeHtml(b.url)}" sandbox="allow-scripts allow-same-origin allow-forms" style="width:100%; height:100%; border:0;"></iframe>`;
            div.style.minHeight = '15vw'; div.style.flex = '1';
        }
    } else if (b.type === 'divider') {
        div.className = 'pv-divider';
        div.style.cssText = `border-bottom: 0.25vw solid ${s.color||'#94a3b8'}; opacity:0.5; margin: ${s.padding||0.5}vw 0;`;
    } else if (b.type === 'table') {
        const tbl = document.createElement('table');
        tbl.className = 'pv-table';
        for (const row of (b.cells || [])) {
            const tr = document.createElement('tr');
            for (let c = 0; c < row.length; c++) {
                const cell = row[c];
                if (cell._covered) continue;
                const td = document.createElement('td');
                if (cell.colspan) td.colSpan = cell.colspan;
                if (cell.rowspan) td.rowSpan = cell.rowspan;
                td.style.cssText = `${cell.bold?'font-weight:800;':''}text-align:${cell.align||s.align||'center'};${cell.bg?`background:${cell.bg};`:''}${cell.color?`color:${cell.color};`:''}`;
                td.textContent = cell.text || '';
                tr.appendChild(td);
            }
            tbl.appendChild(tr);
        }
        div.appendChild(tbl);
        div.style.minHeight = '8vw'; div.style.flex = '1';
    } else if (b.type === 'ticker') {
        const tickDiv = document.createElement('div');
        tickDiv.className = 'pv-ticker ' + (b.position === 'top' ? 'top' : 'bottom');
        if (s.font_size) tickDiv.style.fontSize = s.font_size + 'vw';
        if (s.color) tickDiv.style.color = s.color;
        if (s.bg) tickDiv.style.background = s.bg;
        tickDiv.innerHTML = `<span style="animation-duration:${b.speed||25}s;">${escapeHtml(b.content||'')}</span>`;
        return tickDiv;
    }
    return div;
}

// ──────────────────────────────────────────────────
//  전체화면 미리보기
// ──────────────────────────────────────────────────
function openFullscreen() {
    document.getElementById('fsOverlay').classList.add('show');
    fillFs();
}
function fillFs() {
    const fs = document.getElementById('fsCanvas');
    const src = document.getElementById('previewCanvas');
    fs.style.background = src.style.background;
    fs.innerHTML = src.innerHTML;
}
function closeFullscreen() {
    document.getElementById('fsOverlay').classList.remove('show');
}
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeFullscreen();
});

// ──────────────────────────────────────────────────
//  모바일 탭 전환
// ──────────────────────────────────────────────────
function switchTab(t) {
    const ep = document.getElementById('editPane');
    const pp = document.getElementById('previewPane');
    const te = document.getElementById('tabEdit');
    const tp = document.getElementById('tabPreview');
    if (t === 'edit') {
        ep.classList.remove('hide-m'); pp.classList.add('hide-m');
        te.classList.add('active'); tp.classList.remove('active');
    } else {
        ep.classList.add('hide-m'); pp.classList.remove('hide-m');
        te.classList.remove('active'); tp.classList.add('active');
    }
}

// ──────────────────────────────────────────────────
//  저장
// ──────────────────────────────────────────────────
function saveAs(status) {
    document.getElementById('t_status').value = status;
    submitForm();
}
function submitForm() {
    // covered 셀 정리 (런타임 표시용)
    for (const b of blocks) {
        if (b.type === 'table' && b.cells) {
            // _covered는 유지 (재로딩 시 다시 계산할 수도 있지만 안전하게 보존)
        }
    }
    document.getElementById('blocksJson').value = JSON.stringify(blocks);
    document.getElementById('editorForm').submit();
}
document.getElementById('editorForm').addEventListener('submit', (e) => {
    document.getElementById('blocksJson').value = JSON.stringify(blocks);
});

// 초기화
renderAll();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
