<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생산 현황판 — 태인관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/style.css">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body {
  height:100%;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  overflow:hidden;
}

/* TV 모드 */
.navbar,.sidebar,.sidebar-overlay,#notiDropdown,#notiOverlay { display:none !important; }
body { padding:0 !important; background:#0d1117; color:#e2e8f0; }
.main-content { margin:0 !important; padding:0 !important; }

/* 사이드바 모드 */
body.with-sidebar { overflow:auto; padding-top:var(--navbar-h) !important; padding-left:var(--sidebar-w) !important; }
body.with-sidebar .navbar, body.with-sidebar .sidebar { display:block !important; }
body.with-sidebar .main-content { margin:auto !important; padding:16px !important; }
body.with-sidebar .pm-stage { height:auto; min-height:calc(100vh - 90px); }

/* ── 스테이지 ── */
.pm-stage {
  height:100vh; display:flex; flex-direction:column;
  background:
    radial-gradient(ellipse 80% 30% at 50% 0%, rgba(14,165,233,.06) 0%, transparent 60%),
    #0d1117;
}

/* ── 헤더 ── */
.pm-header {
  flex-shrink:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:.8vh 2vw;
  background:rgba(13,17,23,.9); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.pm-brand { display:flex; align-items:center; gap:10px; }
.pm-brand-icon {
  width:38px; height:38px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; box-shadow:0 0 14px rgba(14,165,233,.4);
}
.pm-title { font-size:clamp(1rem,1.4vw,1.6rem); font-weight:800; letter-spacing:-.3px; }
.pm-title em { font-style:normal; color:#38bdf8; }
.pm-clock {
  font-size:clamp(1.6rem,2.8vw,3.2rem); font-weight:900;
  font-variant-numeric:tabular-nums; letter-spacing:-2px;
  background:linear-gradient(135deg,#38bdf8,#818cf8);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.pm-date { font-size:clamp(.7rem,.8vw,.9rem); color:#334155; text-align:right; margin-top:2px; }

/* ── KPI 카드 (우측 패널) ── */
.pm-info-panel {
  background:rgba(255,255,255,.04);
  display:flex; flex-direction:column;
  gap:1px;
}
.pm-kpi {
  flex:1;
  padding:2vh 2.5vw;
  background:#0d1117;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:.4vh;
  text-align:center;
}
.pm-kpi-lbl {
  font-size:clamp(.72rem,.85vw,.95rem); font-weight:700;
  color:#475569; text-transform:uppercase; letter-spacing:.6px;
}
.pm-kpi-val {
  font-size:clamp(2.2rem,5vw,6rem); font-weight:900;
  font-variant-numeric:tabular-nums; letter-spacing:-3px; line-height:1;
}
.kv-blue  { color:#38bdf8; text-shadow:0 0 30px rgba(56,189,248,.3); }
.kv-amber { color:#fb923c; text-shadow:0 0 30px rgba(251,146,60,.3); }
.kv-green { color:#4ade80; text-shadow:0 0 30px rgba(74,222,128,.3); }
.kv-red   { color:#f87171; text-shadow:0 0 30px rgba(248,113,113,.3); }
.pm-kpi-sub { font-size:clamp(.65rem,.75vw,.85rem); color:#334155; margin-top:.2vh; }

/* ── 중간 영역 ── */
.pm-mid {
  flex:1; min-height:0;
  display:grid; grid-template-columns:38% 1fr;
  gap:1px; background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.06);
}

/* 도넛 패널 */
.pm-donut-panel {
  background:#0d1117;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2vh 1.5vw; gap:2vh;
}
.pm-donut-title {
  font-size:clamp(.72rem,.85vw,.95rem); font-weight:700;
  color:#475569; text-transform:uppercase; letter-spacing:.6px;
  align-self:flex-start;
}
.pm-donut-wrap {
  position:relative;
  width:min(100%, 38vh); aspect-ratio:1/1;
  flex-shrink:0;
}
.pm-donut-svg { width:100%; height:100%; display:block; }
.donut-track { fill:none; stroke:#161b22; stroke-width:10; }
.donut-fill {
  fill:none; stroke-width:10; stroke-linecap:round;
  transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1), stroke .4s;
}
.donut-fill.df-green { stroke:#4ade80; filter:drop-shadow(0 0 6px rgba(74,222,128,.7)); }
.donut-fill.df-amber { stroke:#fb923c; filter:drop-shadow(0 0 6px rgba(251,146,60,.7)); }
.donut-fill.df-red   { stroke:#f87171; filter:drop-shadow(0 0 6px rgba(248,113,113,.6)); }
.pm-donut-center {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  pointer-events:none;
}
.pm-donut-pct {
  font-size:clamp(1.6rem,4vw,4.5rem); font-weight:900;
  font-variant-numeric:tabular-nums; letter-spacing:-2px; line-height:1;
}
.pm-donut-unit { font-size:clamp(.65rem,.8vw,.9rem); color:#475569; margin-top:3px; }
.pm-donut-info {
  display:flex; flex-direction:column; align-items:center; gap:.4vh;
  width:100%;
}
.pm-donut-info-row {
  display:flex; justify-content:space-between; width:100%;
  font-size:clamp(.65rem,.78vw,.88rem);
}
.pm-donut-info-row .lbl { color:#475569; }
.pm-donut-info-row .val { color:#94a3b8; font-weight:600; font-variant-numeric:tabular-nums; }
.pm-donut-gauge {
  width:100%; height:4px; background:#161b22; border-radius:99px; overflow:hidden; margin-top:.5vh;
}
.pm-donut-gauge-fill {
  height:100%; border-radius:99px;
  transition:width .8s cubic-bezier(.4,0,.2,1);
}


/* ── 하단 시간별 추이 ── */
.pm-hourly-panel {
  flex-shrink:0; height:28vh;
  background:#0d1117;
  display:flex; flex-direction:column;
  padding:1vh 1.5vw .8vh;
}
.pm-hourly-title {
  font-size:clamp(.72rem,.85vw,.95rem); font-weight:700;
  color:#475569; text-transform:uppercase; letter-spacing:.6px;
  margin-bottom:.5vh; flex-shrink:0;
}
.pm-hourly-svg-wrap { flex:1; min-height:0; }
.pm-hourly-svg { width:100%; height:100%; overflow:visible; display:block; }

/* ── 힌트 ── */
.pm-hint {
  position:fixed; bottom:.6vh; right:1vw; z-index:999;
  color:#1e293b; font-size:.65rem; opacity:.4;
  background:rgba(13,17,23,.6); padding:2px 8px; border-radius:4px;
  user-select:none; pointer-events:none;
}
body:hover .pm-hint { opacity:.7; }
.pm-hint kbd {
  background:#0f172a; color:#334155;
  border:1px solid #1e293b; padding:1px 4px; border-radius:3px; font-size:.65rem;
}

/* ── 모바일 최적화 (≤640px) ── */
@media (max-width:640px) {
  /* 헤더 */
  .pm-header { padding:.5vh 4vw; }
  .pm-brand-icon { width:26px; height:26px; font-size:.9rem; }
  .pm-title { font-size:.9rem; }
  .pm-clock { font-size:clamp(1.3rem,5.5vw,1.8rem); letter-spacing:-1px; }
  .pm-date { font-size:.6rem; margin-top:1px; }

  /* 중간 영역: 세로 스택, KPI 위→도넛 아래 */
  .pm-mid { display:flex; flex-direction:column; gap:1px; }

  /* KPI 패널 → 맨 위, 가로 배열 */
  .pm-info-panel {
    order:-1; flex-direction:row; flex-shrink:0;
  }
  .pm-kpi {
    flex:1; padding:1.5vh 1vw; gap:.15vh;
    border-right:1px solid rgba(255,255,255,.04);
  }
  .pm-kpi:last-child { border-right:none; }
  .pm-kpi-lbl { font-size:.6rem; letter-spacing:.2px; }
  .pm-kpi-val { font-size:clamp(1.2rem,6vw,2rem); letter-spacing:-1px; }
  .pm-kpi-sub { font-size:.55rem; }

  /* 도넛 패널 → 가로 배열 (도넛 좌, info 우) */
  .pm-donut-panel {
    flex:1; min-height:0;
    flex-direction:row; padding:1.5vh 4vw; gap:4vw;
    justify-content:center; align-items:center;
  }
  .pm-donut-title { display:none; }
  .pm-donut-wrap { width:min(38vw,22vh); flex-shrink:0; }
  .pm-donut-pct { font-size:clamp(1.1rem,5vw,1.8rem); letter-spacing:-1px; }
  .pm-donut-unit { font-size:.58rem; }
  .pm-donut-info { width:auto; flex:1; gap:.4vh; }
  .pm-donut-info-row { font-size:.7rem; }
  .pm-donut-gauge { margin-top:.4vh; }

  /* 하단 차트 */
  .pm-hourly-panel { height:24vh; padding:.8vh 2vw .5vh; }
  .pm-hourly-title { font-size:.68rem; margin-bottom:.3vh; }
}
</style>
</head>
<body>
{% include "_sidebar.html" %}
<div class="main-content">
<div class="pm-stage">

  <!-- 헤더 -->
  <div class="pm-header">
    <div class="pm-brand">
      <div class="pm-brand-icon">🎯</div>
      <div>
        <div class="pm-title">실시간 <em>생산 현황</em></div>
      </div>
    </div>
    <div class="text-end">
      <div class="pm-clock" id="pmClock">--:--:--</div>
      <div class="pm-date" id="pmDate"></div>
    </div>
  </div>

  <!-- 중간: 도넛 + KPI -->
  <div class="pm-mid">

    <!-- 달성률 도넛 -->
    <div class="pm-donut-panel">
      <div class="pm-donut-title">달성률</div>
      <div class="pm-donut-wrap">
        <svg class="pm-donut-svg" viewBox="0 0 100 100" id="donutSvg">
          <circle cx="50" cy="50" r="40" class="donut-track"/>
          <circle cx="50" cy="50" r="40" class="donut-fill df-green"
            id="donutFill"
            stroke-dasharray="251.33"
            stroke-dashoffset="251.33"
            transform="rotate(-90 50 50)"/>
        </svg>
        <div class="pm-donut-center">
          <div class="pm-donut-pct kv-green" id="donutPct">0%</div>
          <div class="pm-donut-unit">달성</div>
        </div>
      </div>
      <div class="pm-donut-info">
        <div class="pm-donut-info-row">
          <span class="lbl">가동 라인</span>
          <span class="val" id="donutLive">- / -</span>
        </div>
        <div class="pm-donut-info-row">
          <span class="lbl">목표 달성</span>
          <span class="val" id="donutOver">- 라인</span>
        </div>
        <div class="pm-donut-gauge">
          <div class="pm-donut-gauge-fill" id="donutGaugeFill"
            style="width:0%;background:linear-gradient(90deg,#15803d,#4ade80)"></div>
        </div>
      </div>
    </div>

    <!-- KPI 정보 -->
    <div class="pm-info-panel">
      <div class="pm-kpi">
        <div class="pm-kpi-lbl">목표량</div>
        <div class="pm-kpi-val kv-blue" id="kpiTarget">-</div>
        <div class="pm-kpi-sub" id="kpiTargetSub">전체 라인 합산</div>
      </div>
      <div class="pm-kpi">
        <div class="pm-kpi-lbl">총 생산량</div>
        <div class="pm-kpi-val kv-amber" id="kpiTotal">-</div>
        <div class="pm-kpi-sub" id="kpiTotalSub">오늘 누적</div>
      </div>
      <div class="pm-kpi">
        <div class="pm-kpi-lbl">전체 달성률</div>
        <div class="pm-kpi-val kv-green" id="kpiPct">- %</div>
        <div class="pm-kpi-sub" id="kpiPctSub">목표 대비</div>
      </div>
    </div>

  </div>

  <!-- 하단: 시간별 추이 -->
  <div class="pm-hourly-panel">
    <div class="pm-hourly-title">시간별 생산 추이</div>
    <div class="pm-hourly-svg-wrap">
      <svg class="pm-hourly-svg" id="hourlySvg" viewBox="0 0 1000 160" preserveAspectRatio="none"></svg>
    </div>
  </div>

</div>
</div>

<div class="pm-hint"><kbd>F</kbd> TV / 일반 모드</div>

<script>
var POLL_STATUS_MS  = 5000;
var POLL_HOURLY_MS  = 60000;
var statusTimer = null, hourlyTimer = null;
var lastHourly  = {};

function fmt(n){ return (n||0).toLocaleString('ko-KR'); }
function pad(x){ return String(x).padStart(2,'0'); }
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }

/* ── 시계 ── */
function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  document.getElementById('pmClock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  document.getElementById('pmDate').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')';
}

/* ── 도넛 SVG 업데이트 ── */
var CIRC = 2*Math.PI*40; // r=40
function updateDonut(pct, liveN, totalN, overN){
  var p=clamp(pct,0,100);
  var cls = p>=100?'df-green':p>=80?'df-amber':'df-red';
  var fill=document.getElementById('donutFill');
  fill.className.baseVal='donut-fill '+cls;
  fill.setAttribute('stroke-dashoffset', (CIRC*(1-p/100)).toFixed(2));

  var pctEl=document.getElementById('donutPct');
  pctEl.textContent=p.toFixed(1)+'%';
  pctEl.className='pm-donut-pct '+(p>=100?'kv-green':p>=80?'kv-amber':'kv-red');

  document.getElementById('donutLive').textContent=liveN+' / '+totalN+' 대';
  document.getElementById('donutOver').textContent=overN+' 라인';

  var gf=document.getElementById('donutGaugeFill');
  gf.style.width=clamp(p,0,100)+'%';
  gf.style.background=p>=100?'linear-gradient(90deg,#15803d,#4ade80)':
                       p>=80 ?'linear-gradient(90deg,#c2410c,#fb923c)':
                               'linear-gradient(90deg,#1d4ed8,#38bdf8)';
}

/* ── KPI 업데이트 ── */
function updateKpi(totalTarget, totalProd, pct, overN, totalN){
  document.getElementById('kpiTarget').textContent=fmt(totalTarget);
  document.getElementById('kpiTargetSub').textContent=totalN+'개 라인 합산';
  document.getElementById('kpiTotal').textContent=fmt(totalProd);
  document.getElementById('kpiTotalSub').textContent='전체 누적';

  var pctEl=document.getElementById('kpiPct');
  var p=pct.toFixed(1);
  pctEl.textContent=p+'%';
  pctEl.className='pm-kpi-val '+(pct>=100?'kv-green':pct>=80?'kv-amber':'kv-red');
  document.getElementById('kpiPctSub').textContent='목표 대비 · 달성 '+overN+'라인';
}

/* ── 시간별 바차트 ── */
function renderHourlyChart(hourly, currentHour){
  var svg=document.getElementById('hourlySvg');
  var W=1000, H=160;
  var PAD_L=8, PAD_R=8, PAD_TOP=20, PAD_BOT=22;
  var chartW=W-PAD_L-PAD_R, chartH=H-PAD_TOP-PAD_BOT;
  var n=24;
  var barW=Math.floor(chartW/n*0.65);
  var step=chartW/n;

  var vals=[];
  for(var i=0;i<24;i++) vals.push(hourly[i]||0);
  var maxVal=Math.max.apply(null,vals)||1;

  var html='';
  vals.forEach(function(v,i){
    var cx=PAD_L+step*(i+0.5);
    var x=cx-barW/2;
    var bh=chartH*v/maxVal;
    var by=PAD_TOP+chartH-bh;
    var isCurrent=(i===currentHour);
    var col = isCurrent ? '#818cf8' : (v===0 ? '#1e293b' : '#fb923c');
    var opacity = isCurrent ? '1' : (v===0 ? '0.3' : '0.85');

    html+='<rect x="'+x.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW+'" height="'+bh.toFixed(1)+'"'+
      ' fill="'+col+'" rx="2" opacity="'+opacity+'"/>';

    /* 값 레이블 (0이 아닌 것만) */
    if(v>0){
      html+='<text x="'+cx.toFixed(1)+'" y="'+(by-3).toFixed(1)+'"'+
        ' text-anchor="middle" font-size="7.5" fill="'+col+'" font-weight="600">'+fmt(v)+'</text>';
    }

    /* 시간 레이블 (짝수만) */
    if(i%2===0){
      html+='<text x="'+cx.toFixed(1)+'" y="'+(H-PAD_BOT+12).toFixed(1)+'"'+
        ' text-anchor="middle" font-size="8" fill="'+(isCurrent?'#818cf8':'#334155')+'">'+i+'</text>';
    }
  });

  svg.innerHTML=html;
}

/* ── 상태 polling ── */
function fetchStatus(){
  fetch('/mes/api/status').then(function(r){return r.json();}).then(function(d){
    if(!d.ok) return;
    var devices=d.devices||[];
    if(!devices.length) return;

    var totalTarget=0, totalProd=0, liveN=0, overN=0;
    devices.forEach(function(d){
      totalTarget+=d.target||0;
      totalProd+=d.today_total||0;
      if(d.latest_time&&d.latest_time!=='-') liveN++;
      if(d.over_target) overN++;
    });
    var pct=totalTarget>0?totalProd/totalTarget*100:0;

    updateKpi(totalTarget, totalProd, pct, overN, devices.length);
    updateDonut(pct, liveN, devices.length, overN);
  }).catch(function(){});
}

/* ── 시간별 polling ── */
function fetchHourly(){
  fetch('/mes/api/hourly').then(function(r){return r.json();}).then(function(d){
    if(!d.ok) return;
    lastHourly=d.hourly||{};
    renderHourlyChart(lastHourly, d.current_hour||new Date().getHours());
  }).catch(function(){});
}

/* ── 모드 전환 ── */
function applyMode(){
  var p=new URLSearchParams(window.location.search);
  document.body.classList.toggle('with-sidebar', p.get('mode')==='normal');
}
function toggleMode(){
  var p=new URLSearchParams(window.location.search);
  if(p.get('mode')==='normal') p.delete('mode'); else p.set('mode','normal');
  var qs=p.toString(); window.location.search=qs?'?'+qs:'';
}
document.addEventListener('keydown',function(e){
  var t=(e.target.tagName||'').toLowerCase();
  if(t==='input'||t==='textarea'||e.target.isContentEditable) return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleMode();}
});

function startPolling(){
  fetchStatus(); statusTimer=setInterval(fetchStatus,POLL_STATUS_MS);
  fetchHourly(); hourlyTimer=setInterval(fetchHourly,POLL_HOURLY_MS);
}
function stopPolling(){
  clearInterval(statusTimer); clearInterval(hourlyTimer);
  statusTimer=null; hourlyTimer=null;
}

document.addEventListener('DOMContentLoaded',function(){
  applyMode(); tickClock(); setInterval(tickClock,1000); startPolling();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden) stopPolling(); else startPolling();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
